<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPACElogic Maker Space Arcade</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050b16; --panel:#0e1d36; --cyan:#35e0ff; --orange:#ff8a1f; --yellow:#ffd23f; --text:#e8f4ff;
  }
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--text);
    font-family:'Chakra Petch',Bahnschrift,system-ui,sans-serif}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;object-fit:contain;background:#000;cursor:none}
  video#cam{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none}
  #start{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;
    background:
      linear-gradient(rgba(53,224,255,.06) 1px,transparent 1px) 0 0/48px 48px,
      linear-gradient(90deg,rgba(53,224,255,.06) 1px,transparent 1px) 0 0/48px 48px,
      radial-gradient(ellipse at 50% 40%,#12305a,#050b16 70%)}
  #start h1{margin:0;font-size:clamp(44px,9vw,120px);font-weight:700;letter-spacing:.01em;line-height:1}
  #start h1 span{color:var(--cyan)}
  #start h2{margin:0 0 20px;font-size:clamp(18px,2.4vw,32px);font-weight:500;color:var(--orange);letter-spacing:.14em}
  #start button{font:inherit;font-size:clamp(20px,2.4vw,34px);font-weight:700;padding:.6em 1.6em;border-radius:14px;
    border:3px solid var(--orange);background:rgba(255,138,31,.12);color:var(--text);cursor:pointer}
  #start button:hover,#start button:focus-visible{background:var(--orange);color:#1a0d00;outline:none}
  #start p{margin:18px 0 0;max-width:640px;color:#8fb0d6;font-size:clamp(14px,1.4vw,19px);line-height:1.5}
  #start img{max-height:84px}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<video id="cam" playsinline muted></video>

<div id="start">
  <!-- Optional: drop a logo.png next to this file and it shows up here and in the menu -->
  <img src="logo.png" alt="" onerror="this.remove()">
  <h1>SPACE<span>logic</span></h1>
  <h2>MAKER SPACE ARCADE</h2>
  <button id="startBtn">Start the station</button>
  <p>Allow camera access when asked. Stand 2 to 3 metres from the TV with the camera at chest height.
     No camera? Mouse and arrow keys work for testing.</p>
</div>

<script type="module">
import {FilesetResolver, PoseLandmarker} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

/* =====================================================================
   CONFIG: tweak these on site
   ===================================================================== */
const CFG = {
  brand1:'SPACE', brand2:'logic', sub:'MAKER SPACE ARCADE',
  model:'lite',            // 'lite' = fast, 'full' = more accurate
  dwell:1.2,               // seconds to hold the hand cursor on a button
  roundSeconds:75,         // one shift length
  lives:3,
  // gesture thresholds, as a fraction of the player's own torso length
  jumpUp:0.26,             // shoulders rise this much  -> jump
  duckDown:0.30,           // shoulders drop this much  -> squat
  duckRelease:0.18,
  leanOn:0.22,             // torso lean (sin of angle) to change lane
  stepOn:0.9               // or sidestep, in shoulder widths
};
const WASM  = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const MODEL = `https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_${CFG.model}/float16/1/pose_landmarker_${CFG.model}.task`;
const FONT  = "'Chakra Petch', Bahnschrift, system-ui, sans-serif";
const C = {bg:'#050b16',panel:'#0e1d36',cyan:'#35e0ff',orange:'#ff8a1f',yellow:'#ffd23f',red:'#ff4d5e',
           green:'#4dff9a',text:'#e8f4ff',dim:'#6b86a8'};

/* =====================================================================
   BASICS
   ===================================================================== */
const W=1920,H=1080;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const video=document.getElementById('cam');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const logo=new Image();let logoOK=false;logo.onload=()=>logoOK=true;logo.src='logo.png';

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function txt(s,x,y,size=40,col=C.text,align='left',weight=700){
  ctx.font=`${weight} ${size}px ${FONT}`;ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(s,x,y);}
function wrap(s,x,y,maxW,size,lh,col,align='left'){
  ctx.font=`500 ${size}px ${FONT}`;const words=s.split(' ');let line='';
  for(const w of words){const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW&&line){txt(line,x,y,size,col,align,500);y+=lh;line=w;}else line=t;}
  if(line)txt(line,x,y,size,col,align,500);return y;}
function brand(x,y,size){
  ctx.font=`700 ${size}px ${FONT}`;const w1=ctx.measureText(CFG.brand1).width;
  txt(CFG.brand1,x,y,size,C.text,'left',700);txt(CFG.brand2,x+w1,y,size,C.cyan,'left',700);}

/* One Euro filter: smooth when still, responsive when moving fast */
class OneEuro{
  constructor(minCut=2,beta=8,dcut=1.5){this.minCut=minCut;this.beta=beta;this.dcut=dcut;this.x=null;this.dx=0;this.t=0;}
  a(c,dt){return 1/(1+(1/(2*Math.PI*c))/dt);}
  f(v,t){
    if(this.x===null){this.x=v;this.t=t;this.dx=0;return v;}
    const dt=Math.max(t-this.t,1e-3);this.t=t;
    this.dx=lerp(this.dx,(v-this.x)/dt,this.a(this.dcut,dt));
    this.x=lerp(this.x,v,this.a(this.minCut+this.beta*Math.abs(this.dx),dt));
    return this.x;}
  reset(){this.x=null;}
}

/* Sound (needs one user click to unlock) */
let actx=null;
function beep(f=600,d=.08,type='square',vol=.05,slide=0){
  if(!actx)return;const o=actx.createOscillator(),g=actx.createGain(),n=actx.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,n);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),n+d);
  g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);
  o.connect(g);g.connect(actx.destination);o.start(n);o.stop(n+d);}
const sfx={
  select:()=>{beep(520,.07);setTimeout(()=>beep(780,.1),70);},
  jump:()=>beep(380,.18,'square',.04,500),
  gear:()=>{beep(990,.05,'triangle',.06);setTimeout(()=>beep(1320,.08,'triangle',.06),50);},
  hit:()=>beep(160,.35,'sawtooth',.08,-100),
  tick:()=>beep(620,.1,'square',.05),
  go:()=>beep(1040,.3,'square',.06),
  over:()=>{beep(440,.2,'sawtooth',.06,-200);setTimeout(()=>beep(300,.4,'sawtooth',.06,-200),200);}
};

/* =====================================================================
   POSE TRACKING (MediaPipe)
   Coordinates: X is mirrored (player's left = screen left) and scaled by
   the video aspect so X and Y are in the same "height" units.
   ===================================================================== */
let landmarker=null,camOK=false,status='Starting…';
const P={ok:false,lastSeen:-99,sx:0,sy:0,hx:0,hy:0,shW:.15,torso:.25,hasHips:false,lean:0,
         cur:{x:.5,y:.5},curOk:false,bothUp:false,lm:null};
const F={sx:new OneEuro(),sy:new OneEuro(),sw:new OneEuro(),hx:new OneEuro(),hy:new OneEuro(),
         cx:new OneEuro(1.2,4),cy:new OneEuro(1.2,4)};
const camMode=()=>camOK&&!!landmarker;

async function initCam(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720,facingMode:'user'},audio:false});
    video.srcObject=s;await video.play();camOK=true;
  }catch(e){status='No camera (mouse and keyboard mode)';console.warn(e);}
}
async function initModel(){
  try{
    status='Loading pose model…';
    const fs=await FilesetResolver.forVisionTasks(WASM);
    const opts=d=>({baseOptions:{modelAssetPath:MODEL,delegate:d},runningMode:'VIDEO',numPoses:1,
      minPoseDetectionConfidence:.5,minPosePresenceConfidence:.5,minTrackingConfidence:.5});
    try{landmarker=await PoseLandmarker.createFromOptions(fs,opts('GPU'));}
    catch(e){landmarker=await PoseLandmarker.createFromOptions(fs,opts('CPU'));}
    status='';
  }catch(e){status='Pose model failed to load (mouse and keyboard mode)';console.error(e);}
}
let lastVT=-1;
function detect(now){
  if(!landmarker||!camOK||video.readyState<2||video.currentTime===lastVT)return;
  lastVT=video.currentTime;
  const res=landmarker.detectForVideo(video,now);
  processPose(res.landmarks,now/1000);
}
function processPose(lms,t){
  P.bothUp=false;
  if(!lms||!lms.length){P.ok=false;P.lm=null;return;}
  const lm=lms[0];P.lm=lm;
  const asp=video.videoWidth/video.videoHeight;
  const X=i=>(1-lm[i].x)*asp,Y=i=>lm[i].y,V=i=>lm[i].visibility??1;
  if(V(11)<.5||V(12)<.5){P.ok=false;return;}
  P.ok=true;P.lastSeen=t;
  P.sx=F.sx.f((X(11)+X(12))/2,t);
  P.sy=F.sy.f((Y(11)+Y(12))/2,t);
  P.shW=F.sw.f(Math.abs(X(11)-X(12)),t);
  P.hasHips=V(23)>.4&&V(24)>.4;
  if(P.hasHips){
    P.hx=F.hx.f((X(23)+X(24))/2,t);P.hy=F.hy.f((Y(23)+Y(24))/2,t);
    P.torso=Math.max(.05,Math.hypot(P.sx-P.hx,P.sy-P.hy));
    P.lean=(P.sx-P.hx)/P.torso;
  }else{P.torso=P.shW*1.25;P.lean=0;}
  // pointing hand = the highest of the two index fingers (falls back to wrists)
  let best=null;
  for(const [a,b] of [[19,15],[20,16]]){
    const i=V(a)>.4?a:(V(b)>.4?b:-1);if(i<0)continue;
    if(!best||Y(i)<best.y)best={x:X(i),y:Y(i)};
  }
  if(best){
    // body-relative mapping: works at any distance from the camera
    const cx=.5+(best.x-P.sx)/(P.shW*4);
    const cy=(best.y-(P.sy-.9*P.torso))/(1.7*P.torso);
    P.cur.x=F.cx.f(cx,t);P.cur.y=F.cy.f(cy,t);P.curOk=cy<1.1;
  }else{P.curOk=false;F.cx.reset();F.cy.reset();}
  P.bothUp=V(15)>.5&&V(16)>.5&&Y(15)<Y(0)&&Y(16)<Y(0);
}
const tracked=t=>camMode()&&P.ok&&t-P.lastSeen<.6;

const CONN=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
function drawCam(x,y,w,h,label=true){
  ctx.save();rr(x,y,w,h,18);ctx.clip();
  ctx.fillStyle='#08111f';ctx.fillRect(x,y,w,h);
  if(camOK&&video.readyState>=2){
    ctx.save();ctx.translate(x+w,y);ctx.scale(-1,1);ctx.globalAlpha=.8;ctx.drawImage(video,0,0,w,h);ctx.restore();
  }
  if(P.lm){
    const pt=i=>[x+(1-P.lm[i].x)*w,y+P.lm[i].y*h];
    ctx.strokeStyle=C.cyan;ctx.lineWidth=Math.max(3,w/90);ctx.lineCap='round';
    for(const [a,b] of CONN){if((P.lm[a].visibility??1)<.4||(P.lm[b].visibility??1)<.4)continue;
      const A=pt(a),B=pt(b);ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();}
    ctx.fillStyle=C.orange;
    for(const i of [0,11,12,15,16,19,20,23,24]){if((P.lm[i].visibility??1)<.4)continue;
      const p=pt(i);ctx.beginPath();ctx.arc(p[0],p[1],Math.max(4,w/70),0,7);ctx.fill();}
  }
  ctx.restore();
  rr(x,y,w,h,18);ctx.lineWidth=3;ctx.strokeStyle=P.ok?C.green:'#2b3d5c';ctx.stroke();
  if(label){
    const s=!camOK?'No camera':!landmarker?'Loading model…':P.ok?'Tracking':'No player in view';
    txt(s,x+14,y+h-14,Math.max(18,w/16),P.ok?C.green:C.dim,'left',600);
  }
}

/* =====================================================================
   STATE + UI (hand cursor with hover-to-select)
   ===================================================================== */
let state='menu',stateT=0,lock=.5,exitHold=0,ptr={on:false};
let buttons=[],hov={id:null,t:0};
const mouse={x:-1,y:-1,t:-99};
const kb={down:false};
let base=null;
const cal={samples:[],msg:'',prog:0,ok:false};
let cdLast=-1;

function go(s){state=s;stateT=0;lock=.6;hov={id:null,t:0};cdLast=-1;}
function addBtn(id,x,y,w,h,on=true){buttons.push({id,x,y,w,h,on});}
const inRect=(p,x,y,w,h)=>p.on&&p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h;
function pointer(t){
  if(t-mouse.t<4)return{x:mouse.x,y:mouse.y,on:true,src:'mouse'};
  if(camMode()&&tracked(t)&&P.curOk)return{x:clamp(P.cur.x,0,1)*W,y:clamp(P.cur.y,0,1)*H,on:true,src:'hand'};
  return{on:false};
}
function updateUI(dt,t){
  ptr=pointer(t);
  let h=null;
  if(ptr.on)for(const b of buttons)if(b.on&&inRect(ptr,b.x,b.y,b.w,b.h)){h=b;break;}
  if(!h||lock>0){hov={id:null,t:0};return;}
  if(hov.id!==h.id)hov={id:h.id,t:0};
  hov.t+=dt;
  if(hov.t>=CFG.dwell){const id=h.id;hov={id:null,t:0};press(id);}
}
const prog=id=>hov.id===id?clamp(hov.t/CFG.dwell,0,1):0;
function press(id){
  sfx.select();
  if(id==='game:runner'||id==='again')startFlow();
  else if(id==='menu')go('menu');
}
function startFlow(){
  resetRun();
  if(camMode()){base=null;cal.samples=[];cal.prog=0;cal.msg='';go('calib');}
  else go('countdown');
}

/* =====================================================================
   MAKER RUN: game logic
   ===================================================================== */
const R={};
function resetRun(){
  Object.assign(R,{t:0,pos:0,speed:14,score:0,gears:0,lives:CFG.lives,lane:0,laneX:0,h:0,jumpT:-1,
    duckPose:false,duck:false,duckAmt:0,jumpLatch:false,inv:0,shake:0,flash:0,phase:0,items:[],decor:[],
    nextAt:45,decNext:5,lastType:'',lostT:0,over:'',best:[]});
}
resetRun();
function jump(){if(R.jumpT>=0)return;R.jumpT=0;sfx.jump();}
function spawnRow(){
  const at=R.nextAt,lanes=[-1,0,1];
  let r=Math.random(),type=r<.34?'block':r<.62?'jump':r<.82?'duck':'gears';
  if(type===R.lastType&&type!=='gears')type='gears';
  if(type==='block'){
    const sh=shuffle(lanes),n=Math.random()<.5?1:2;
    sh.slice(0,n).forEach(l=>R.items.push({k:'block',lane:l,wz:at}));
    if(Math.random()<.6)for(let i=0;i<3;i++)R.items.push({k:'gear',lane:sh[n],wz:at-4+i*4,high:false});
  }else if(type==='jump'){
    const ls=shuffle(lanes).slice(0,1+Math.floor(Math.random()*3));
    ls.forEach(l=>R.items.push({k:'jump',lane:l,wz:at}));
    R.items.push({k:'gear',lane:ls[0],wz:at,high:true});
  }else if(type==='duck'){
    R.items.push({k:'duck',lane:0,wz:at});
  }else{
    const l=lanes[Math.floor(Math.random()*3)];
    for(let i=0;i<5;i++)R.items.push({k:'gear',lane:l,wz:at+i*3.5,high:false});
  }
  R.lastType=type;
  R.nextAt+=R.speed*rand(1.0,1.5)+6;
}
function poseInput(){
  const up=(base.sy-P.sy)/base.torso,down=(P.sy-base.sy)/base.torso;
  if(up>CFG.jumpUp&&!R.jumpLatch){jump();R.jumpLatch=true;}
  if(up<CFG.jumpUp*.45)R.jumpLatch=false;
  if(!R.duckPose&&down>CFG.duckDown)R.duckPose=true;
  else if(R.duckPose&&down<CFG.duckRelease)R.duckPose=false;
  const sl=P.hasHips?P.lean/CFG.leanOn:0,sd=(P.sx-base.sx)/base.shW/CFG.stepOn;
  const s=Math.abs(sl)>Math.abs(sd)?sl:sd;
  if(s<-1)R.lane=-1;else if(s>1)R.lane=1;else if(Math.abs(s)<.5)R.lane=0;
}
function hurt(){
  if(R.inv>0)return;
  R.lives--;R.inv=1.4;R.shake=.4;R.flash=1;sfx.hit();
  if(R.lives<=0)endRun('Out of power');
}
function endRun(reason){
  R.over=reason;R.score=Math.floor(R.pos)+R.gears*25;
  try{const a=JSON.parse(localStorage.getItem('sl_runner_best')||'[]');a.push(R.score);a.sort((x,y)=>y-x);
      R.best=a.slice(0,5);localStorage.setItem('sl_runner_best',JSON.stringify(R.best));}catch(e){R.best=[R.score];}
  sfx.over();go('over');
}
function loadBest(){try{return JSON.parse(localStorage.getItem('sl_runner_best')||'[]');}catch(e){return[];}}

function updateRun(dt,t){
  if(camMode()){
    if(!tracked(t)){R.lostT+=dt;if(R.lostT>12)go('menu');return;}
    R.lostT=0;poseInput();
  }
  R.duck=R.duckPose||kb.down;
  R.t+=dt;R.speed=14+Math.min(14,R.t*.25);R.pos+=R.speed*dt;R.phase+=dt*R.speed*.55;
  R.laneX=lerp(R.laneX,R.lane,1-Math.exp(-dt*12));
  if(R.jumpT>=0){R.jumpT+=dt;const u=R.jumpT/.78;if(u>=1){R.jumpT=-1;R.h=0;}else R.h=4*u*(1-u);}
  R.duckAmt=lerp(R.duckAmt,R.duck&&R.jumpT<0?1:0,1-Math.exp(-dt*14));
  while(R.nextAt<R.pos+75)spawnRow();
  while(R.decNext<R.pos+85){
    for(const side of [-1,1])R.decor.push({side,wz:R.decNext+rand(0,3),k:['bench','shelf','pillar','bench'][Math.floor(Math.random()*4)]});
    R.decNext+=rand(7,12);
  }
  for(const it of R.items){
    if(it.done)continue;const d=it.wz-R.pos;if(d>.7||d<-.9)continue;
    const ov=it.k==='duck'||Math.abs(it.lane-R.laneX)<.62;
    if(it.k==='gear'){
      if(Math.abs(it.lane-R.laneX)<.7&&(!it.high||R.h>.35)){it.done=true;R.gears++;sfx.gear();}
    }else if(ov){
      let hit=false;
      if(it.k==='block')hit=true;
      else if(it.k==='jump')hit=R.h<.5;
      else if(it.k==='duck')hit=R.duckAmt<.6;
      if(hit){it.done=true;hurt();}
    }
  }
  R.items=R.items.filter(it=>it.wz-R.pos>-3);
  R.decor=R.decor.filter(d=>d.wz-R.pos>-3);
  R.inv=Math.max(0,R.inv-dt);R.shake=Math.max(0,R.shake-dt);R.flash=Math.max(0,R.flash-dt*2.2);
  R.score=Math.floor(R.pos)+R.gears*25;
  if(R.t>=CFG.roundSeconds)endRun('Shift complete');
}

function updateCalib(dt,t){
  const asp=video.videoWidth/video.videoHeight||16/9;
  let msg='',ok=false;
  if(!tracked(t))msg='Step into the frame';
  else if(!P.hasHips)msg='Step back until your shoulders and hips are visible';
  else if(P.shW<.10)msg='Step closer';
  else if(P.shW>.36)msg='Step back';
  else if(Math.abs(P.sx-asp/2)>.2*asp)msg='Move to the middle of the frame';
  else ok=true;
  if(!ok){cal.samples=[];cal.prog=0;cal.msg=msg;cal.ok=false;return;}
  cal.samples.push({t,sx:P.sx,sy:P.sy,torso:P.torso,shW:P.shW});
  while(cal.samples.length&&cal.samples[0].t<t-1.5)cal.samples.shift();
  const rng=k=>{let a=1e9,b=-1e9;for(const s of cal.samples){a=Math.min(a,s[k]);b=Math.max(b,s[k]);}return b-a;};
  cal.ok=true;
  if(rng('sy')>.03||rng('sx')>.04){cal.samples=[cal.samples[cal.samples.length-1]];cal.prog=0;cal.msg='Hold still';return;}
  const span=t-cal.samples[0].t;cal.prog=clamp(span/1.2,0,1);cal.msg='Hold still';
  if(span>=1.2){
    const n=cal.samples.length,av=k=>cal.samples.reduce((a,s)=>a+s[k],0)/n;
    base={sx:av('sx'),sy:av('sy'),torso:av('torso'),shW:av('shW')};
    sfx.select();go('countdown');
  }
}

/* =====================================================================
   DRAWING: shared
   ===================================================================== */
const stars=Array.from({length:110},()=>({x:Math.random()*W,y:Math.random()*H,r:rand(.8,2.6),s:rand(4,16)}));
function bgSpace(t){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#040a15');g.addColorStop(1,'#0b1c38');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(53,224,255,.055)';ctx.lineWidth=1;ctx.beginPath();

function drawWorld(t){
  const list=[];
  for(const it of R.items)if(!it.done)list.push({d:it.wz-R.pos,it});
  for(const dc of R.decor)list.push({d:dc.wz-R.pos,dc});
  list.sort((a,b)=>b.d-a.d);
  let playerDrawn=false;
  for(const o of list){
    if(!playerDrawn&&o.d<0){drawPlayer();playerDrawn=true;}
    const d=o.d;if(d>80||d<-1.3)continue;
    const s=sc(d),gy=py(d);

      const it=o.it,x=it.k==='duck'?CX:px(it.lane,d);

  ctx.save();ctx.setLineDash([18,14]);ctx.strokeStyle=C.orange;ctx.lineWidth=5;
  ctx.strokeRect(x+w*.3,y+h*.06,w*.4,h*.88);ctx.restore();
  txt(cal.msg||'Step into the frame',CX,y+h+80,52,cal.ok?C.green:C.orange,'center',700);
  rr(CX-300,y+h+110,600,18,9);ctx.fillStyle='rgba(255,255,255,.12)';ctx.fill();
  if(cal.prog>0){rr(CX-300,y+h+110,600*cal.prog,18,9);ctx.fillStyle=C.green;ctx.fill();}
  txt('Hold both hands above your head for 1.5 s to leave',CX,H-40,24,C.dim,'center',500);
}
function drawOver(t){
  drawScene(t);
  ctx.fillStyle='rgba(3,8,18,.78)';ctx.fillRect(0,0,W,H);
  txt(R.over||'Shift over',CX,230,92,R.over==='Shift complete'?C.green:C.orange,'center',700);
  txt('Score',CX,330,32,C.dim,'center',500);txt(String(R.score),CX,430,130,C.text,'center',700);
  txt(`${Math.floor(R.pos)} m run   ·   ${R.gears} gears`,CX,490,34,C.yellow,'center',600);
  const b=R.best.length?R.best:loadBest();
  txt('Top scores',CX,570,28,C.dim,'center',500);
  b.slice(0,5).forEach((s,i)=>txt(`${i+1}.  ${s}`,CX,612+i*38,30,s===R.score&&i===b.indexOf(R.score)?C.yellow:C.text,'center',600));
  [['again','Play again',CX-440],['menu','Back to menu',CX+40]].forEach(([id,label,x])=>{
    const y=840,w=400,h=130,hv=inRect(ptr,x,y,w,h);addBtn(id,x,y,w,h,true);
    ctx.save();if(hv){ctx.shadowColor=C.orange;ctx.shadowBlur=36;}
    rr(x,y,w,h,22);ctx.fillStyle=id==='again'?'rgba(255,138,31,.18)':'rgba(53,224,255,.1)';ctx.fill();
    ctx.lineWidth=hv?7:4;ctx.strokeStyle=id==='again'?C.orange:C.cyan;ctx.stroke();ctx.restore();
    txt(label,x+w/2,y+80,46,C.text,'center',700);
    const p=prog(id);if(p>0){rr(x+30,y+h-24,(w-60)*p,10,5);ctx.fillStyle=C.orange;ctx.fill();}
  });
  drawCam(40,H-250,350,197);
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
function update(dt,t){
  stateT+=dt;lock=Math.max(0,lock-dt);
  if(state!=='menu'&&tracked(t)&&P.bothUp){exitHold+=dt;if(exitHold>1.5){exitHold=0;go('menu');}}
  else exitHold=Math.max(0,exitHold-dt*2);
  updateUI(dt,t);
  if(state==='calib')updateCalib(dt,t);
  else if(state==='countdown'){
    const n=Math.floor(stateT);if(n!==cdLast&&n<=3){cdLast=n;if(n<3)sfx.tick();else sfx.go();}
    if(stateT>3.7){state='play';stateT=0;}
  }
  else if(state==='play')updateRun(dt,t);
}
function draw(t){
  buttons=[];
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
  if(state==='menu')drawMenu(t);
  else if(state==='calib')drawCalib(t);
  else if(state==='countdown'||state==='play'){
    drawScene(t);
    if(state==='countdown'){
      const n=3-Math.floor(stateT);
      ctx.fillStyle='rgba(3,8,18,.45)';ctx.fillRect(0,0,W,H);
      txt(n>0?String(n):'Go!',CX,560,260,n>0?C.text:C.green,'center',700);
    }
    if(state==='countdown'||(state==='play'&&R.t<7))controlsHint();
    if(state==='play'&&camMode()&&!tracked(t)){
      ctx.fillStyle='rgba(3,8,18,.7)';ctx.fillRect(0,0,W,H);
      txt('Player lost',CX,500,90,C.orange,'center',700);
      txt('Step back into the camera view to continue',CX,570,36,C.text,'center',500);
    }
  }
  else if(state==='over')drawOver(t);
  drawCursor();
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  detect(now);update(dt,now/1000);draw(now/1000);
  requestAnimationFrame(frame);
}

/* =====================================================================
   INPUT: mouse + keyboard fallback, and boot
   ===================================================================== */
function toLogical(e){
  const r=cv.getBoundingClientRect(),s=Math.min(r.width/W,r.height/H);
  return{x:(e.clientX-r.left-(r.width-W*s)/2)/s,y:(e.clientY-r.top-(r.height-H*s)/2)/s};
}
cv.addEventListener('mousemove',e=>{const p=toLogical(e);mouse.x=p.x;mouse.y=p.y;mouse.t=performance.now()/1000;});
cv.addEventListener('click',e=>{
  const p=toLogical(e);mouse.x=p.x;mouse.y=p.y;mouse.t=performance.now()/1000;
  if(lock>0)return;
  for(const b of buttons)if(b.on&&inRect({on:true,...p},b.x,b.y,b.w,b.h)){press(b.id);break;}
});
addEventListener('keydown',e=>{
  if(e.key==='Escape'||e.key==='m'){if(state!=='menu')go('menu');return;}
  if(state==='play'){
    if(e.key==='ArrowLeft')R.lane=Math.max(-1,R.lane-1);
    else if(e.key==='ArrowRight')R.lane=Math.min(1,R.lane+1);
    else if(e.key==='ArrowUp'||e.key===' '){jump();e.preventDefault();}
    else if(e.key==='ArrowDown')kb.down=true;
  }else if((e.key==='Enter'||e.key===' ')&&(state==='menu'))press('game:runner');
  else if(e.key==='Enter'&&state==='over')press('again');
});
addEventListener('keyup',e=>{if(e.key==='ArrowDown')kb.down=false;});

document.getElementById('startBtn').addEventListener('click',async()=>{
  document.getElementById('start').style.display='none';
  try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  try{await document.documentElement.requestFullscreen?.();}catch(e){}
  requestAnimationFrame(frame);
  await initCam();
  if(camOK)await initModel();
});
</script>
