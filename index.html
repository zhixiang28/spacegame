<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPACElogic Maker Space Arcade</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#050b16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050b16; --panel:#0e1d36; --cyan:#35e0ff; --orange:#ff8a1f; --yellow:#ffd23f; --text:#e8f4ff;
  }
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--text);
    font-family:'Chakra Petch',Bahnschrift,system-ui,sans-serif}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;object-fit:contain;background:#000;cursor:none}
  video#cam{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none}
  #start{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;
    background:
      linear-gradient(rgba(53,224,255,.06) 1px,transparent 1px) 0 0/48px 48px,
      linear-gradient(90deg,rgba(53,224,255,.06) 1px,transparent 1px) 0 0/48px 48px,
      radial-gradient(ellipse at 50% 40%,#12305a,#050b16 70%)}
  #start h1{margin:0;font-size:clamp(44px,9vw,120px);font-weight:700;letter-spacing:.01em;line-height:1;color:#cf8c2a}
  #start h1 span{color:#898d8e}
  #start h2{margin:0 0 20px;font-size:clamp(18px,2.4vw,32px);font-weight:500;color:var(--orange);letter-spacing:.14em}
  #start button{font:inherit;font-size:clamp(20px,2.4vw,34px);font-weight:700;padding:.6em 1.6em;border-radius:14px;
    border:3px solid var(--orange);background:rgba(255,138,31,.12);color:var(--text);cursor:pointer}
  #start button:hover,#start button:focus-visible{background:var(--orange);color:#1a0d00;outline:none}
  #start p{margin:18px 0 0;max-width:640px;color:#8fb0d6;font-size:clamp(14px,1.4vw,19px);line-height:1.5}
  #start img{max-height:clamp(70px,18vh,200px);max-width:80vw}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<video id="cam" playsinline muted></video>

<div id="start">
  <!-- logo.png (transparent) is the SPACElogic logo; the text version is the fallback if it is missing -->
  <img src="logo.png" alt="SPACElogic" onload="document.querySelector('#start h1').style.display='none'" onerror="this.remove()">
  <h1>SPACE<span>logic</span></h1>
  <h2>MAKER SPACE ARCADE</h2>
  <button id="startBtn">Start the station</button>
  <button id="installBtn" style="display:none;font-size:clamp(14px,1.4vw,20px);padding:.4em 1.2em;border-color:var(--cyan)">Install as an app</button>
  <p>Allow camera access when asked. Stand 2 to 3 metres from the TV with the camera at chest height.
     No camera? Mouse and arrow keys work for testing. Press F any time to toggle full screen.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module">
import {FilesetResolver, PoseLandmarker} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

/* =====================================================================
   CONFIG: tweak these on site
   ===================================================================== */
const CFG = {
  brand1:'SPACE', brand2:'logic', sub:'MAKER SPACE ARCADE',
  model:'lite',            // 'lite' = fast, 'full' = more accurate
  dwell:1.2,               // seconds to hold the hand cursor on a button
  roundSeconds:75,         // one shift length
  lives:3,
  // gesture thresholds, as a fraction of the player's own torso length
  jumpUp:0.26,             // shoulders rise this much  -> jump
  duckDown:0.30,           // shoulders drop this much  -> squat
  duckRelease:0.18,
  leanOn:0.22,             // torso lean (sin of angle) to change lane
  stepOn:0.9               // or sidestep, in shoulder widths
};
const WASM  = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const MODEL = `https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_${CFG.model}/float16/1/pose_landmarker_${CFG.model}.task`;
const FONT  = "'Chakra Petch', Bahnschrift, system-ui, sans-serif";
const C = {bg:'#050b16',panel:'#0e1d36',cyan:'#35e0ff',orange:'#ff8a1f',yellow:'#ffd23f',red:'#ff4d5e',
           green:'#4dff9a',text:'#e8f4ff',dim:'#6b86a8'};

/* =====================================================================
   BASICS
   ===================================================================== */
const W=1920,H=1080;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const video=document.getElementById('cam');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const logo=new Image();let logoOK=false;logo.onload=()=>logoOK=true;logo.src='logo.png';

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function txt(s,x,y,size=40,col=C.text,align='left',weight=700){
  ctx.font=`${weight} ${size}px ${FONT}`;ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(s,x,y);}
function wrap(s,x,y,maxW,size,lh,col,align='left'){
  ctx.font=`500 ${size}px ${FONT}`;const words=s.split(' ');let line='';
  for(const w of words){const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW&&line){txt(line,x,y,size,col,align,500);y+=lh;line=w;}else line=t;}
  if(line)txt(line,x,y,size,col,align,500);return y;}
const BRAND={a:'#cf8c2a',b:'#898d8e'};     // SPACElogic logo colours: gold + grey
function brandW(size){if(logoOK)return logo.width/logo.height*size*1.05;ctx.font=`700 ${size}px ${FONT}`;return ctx.measureText(CFG.brand1+CFG.brand2).width;}
function brand(x,y,size){
  if(logoOK){const h=size*1.05;ctx.drawImage(logo,x,y-h*.74,logo.width/logo.height*h,h);return;}   // the real logo, baseline at y
  ctx.font=`700 ${size}px ${FONT}`;const w1=ctx.measureText(CFG.brand1).width;
  txt(CFG.brand1,x,y,size,BRAND.a,'left',700);txt(CFG.brand2,x+w1,y,size,BRAND.b,'left',700);}

/* One Euro filter: smooth when still, responsive when moving fast */
class OneEuro{
  constructor(minCut=2,beta=8,dcut=1.5){this.minCut=minCut;this.beta=beta;this.dcut=dcut;this.x=null;this.dx=0;this.t=0;}
  a(c,dt){return 1/(1+(1/(2*Math.PI*c))/dt);}
  f(v,t){
    if(this.x===null){this.x=v;this.t=t;this.dx=0;return v;}
    const dt=Math.max(t-this.t,1e-3);this.t=t;
    this.dx=lerp(this.dx,(v-this.x)/dt,this.a(this.dcut,dt));
    this.x=lerp(this.x,v,this.a(this.minCut+this.beta*Math.abs(this.dx),dt));
    return this.x;}
  reset(){this.x=null;}
}

/* Sound (needs one user click to unlock) */
let actx=null;
function beep(f=600,d=.08,type='square',vol=.05,slide=0){
  if(!actx)return;const o=actx.createOscillator(),g=actx.createGain(),n=actx.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,n);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),n+d);
  g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);
  o.connect(g);g.connect(actx.destination);o.start(n);o.stop(n+d);}
const sfx={
  select:()=>{beep(520,.07);setTimeout(()=>beep(780,.1),70);},
  jump:()=>beep(380,.18,'square',.04,500),
  gear:()=>{beep(990,.05,'triangle',.06);setTimeout(()=>beep(1320,.08,'triangle',.06),50);},
  hit:()=>beep(160,.35,'sawtooth',.08,-100),
  tick:()=>beep(620,.1,'square',.05),
  go:()=>beep(1040,.3,'square',.06),
  over:()=>{beep(440,.2,'sawtooth',.06,-200);setTimeout(()=>beep(300,.4,'sawtooth',.06,-200),200);}
};

/* =====================================================================
   POSE TRACKING (MediaPipe)
   Coordinates: X is mirrored (player's left = screen left) and scaled by
   the video aspect so X and Y are in the same "height" units.
   ===================================================================== */
let landmarker=null,camOK=false,status='Starting…';
const P={ok:false,lastSeen:-99,sx:0,sy:0,hx:0,hy:0,shW:.15,torso:.25,hasHips:false,lean:0,
         cur:{x:.5,y:.5},curOk:false,bothUp:false,lm:null,all:[]};
const F={sx:new OneEuro(),sy:new OneEuro(),sw:new OneEuro(),hx:new OneEuro(),hy:new OneEuro(),
         cx:new OneEuro(1.2,4),cy:new OneEuro(1.2,4)};
const camMode=()=>camOK&&!!landmarker;

async function initCam(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720,facingMode:'user'},audio:false});
    video.srcObject=s;await video.play();camOK=true;
  }catch(e){status='No camera (mouse and keyboard mode)';console.warn(e);}
}
async function initModel(){
  try{
    status='Loading pose model…';
    const fs=await FilesetResolver.forVisionTasks(WASM);
    const opts=d=>({baseOptions:{modelAssetPath:MODEL,delegate:d},runningMode:'VIDEO',numPoses:1,
      minPoseDetectionConfidence:.5,minPosePresenceConfidence:.5,minTrackingConfidence:.5});
    try{landmarker=await PoseLandmarker.createFromOptions(fs,opts('GPU'));}
    catch(e){landmarker=await PoseLandmarker.createFromOptions(fs,opts('CPU'));}
    status='';
  }catch(e){status='Pose model failed to load (mouse and keyboard mode)';console.error(e);}
}
let lastVT=-1;
function detect(now){
  if(!landmarker||!camOK||video.readyState<2||video.currentTime===lastVT)return;
  lastVT=video.currentTime;
  const res=landmarker.detectForVideo(video,now);
  processPose(res.landmarks,now/1000);
}
function processPose(lms,t){
  P.bothUp=false;P.all=lms||[];
  if(!lms||!lms.length){P.ok=false;P.lm=null;return;}
  const lm=lms[0];P.lm=lm;
  const asp=video.videoWidth/video.videoHeight;
  const X=i=>(1-lm[i].x)*asp,Y=i=>lm[i].y,V=i=>lm[i].visibility??1;
  if(V(11)<.5||V(12)<.5){P.ok=false;return;}
  P.ok=true;P.lastSeen=t;
  P.sx=F.sx.f((X(11)+X(12))/2,t);
  P.sy=F.sy.f((Y(11)+Y(12))/2,t);
  P.shW=F.sw.f(Math.abs(X(11)-X(12)),t);
  P.hasHips=V(23)>.4&&V(24)>.4;
  if(P.hasHips){
    P.hx=F.hx.f((X(23)+X(24))/2,t);P.hy=F.hy.f((Y(23)+Y(24))/2,t);
    P.torso=Math.max(.05,Math.hypot(P.sx-P.hx,P.sy-P.hy));
    P.lean=(P.sx-P.hx)/P.torso;
  }else{P.torso=P.shW*1.25;P.lean=0;}
  // pointing hand = the highest of the two index fingers (falls back to wrists)
  let best=null;
  for(const [a,b] of [[19,15],[20,16]]){
    const i=V(a)>.4?a:(V(b)>.4?b:-1);if(i<0)continue;
    if(!best||Y(i)<best.y)best={x:X(i),y:Y(i)};
  }
  if(best){
    // body-relative mapping: works at any distance from the camera
    const cx=.5+(best.x-P.sx)/(P.shW*4);
    const cy=(best.y-(P.sy-.9*P.torso))/(1.7*P.torso);
    P.cur.x=F.cx.f(cx,t);P.cur.y=F.cy.f(cy,t);P.curOk=cy<1.1;
  }else{P.curOk=false;F.cx.reset();F.cy.reset();}
  P.bothUp=V(15)>.5&&V(16)>.5&&Y(15)<Y(0)&&Y(16)<Y(0);
}
const tracked=t=>camMode()&&P.ok&&t-P.lastSeen<.6;

const CONN=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
function drawCam(x,y,w,h,label=true){
  ctx.save();rr(x,y,w,h,18);ctx.clip();
  ctx.fillStyle='#08111f';ctx.fillRect(x,y,w,h);
  if(camOK&&video.readyState>=2){
    ctx.save();ctx.translate(x+w,y);ctx.scale(-1,1);ctx.globalAlpha=.8;ctx.drawImage(video,0,0,w,h);ctx.restore();
  }
  if(P.lm){
    const pt=i=>[x+(1-P.lm[i].x)*w,y+P.lm[i].y*h];
    ctx.strokeStyle=C.cyan;ctx.lineWidth=Math.max(3,w/90);ctx.lineCap='round';
    for(const [a,b] of CONN){if((P.lm[a].visibility??1)<.4||(P.lm[b].visibility??1)<.4)continue;
      const A=pt(a),B=pt(b);ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();}
    ctx.fillStyle=C.orange;
    for(const i of [0,11,12,15,16,19,20,23,24]){if((P.lm[i].visibility??1)<.4)continue;
      const p=pt(i);ctx.beginPath();ctx.arc(p[0],p[1],Math.max(4,w/70),0,7);ctx.fill();}
  }
  ctx.restore();
  rr(x,y,w,h,18);ctx.lineWidth=3;ctx.strokeStyle=P.ok?C.green:'#2b3d5c';ctx.stroke();
  if(label){
    const s=!camOK?'No camera':!landmarker?'Loading model…':P.ok?'Tracking':'No player in view';
    txt(s,x+14,y+h-14,Math.max(18,w/16),P.ok?C.green:C.dim,'left',600);
  }
}

/* =====================================================================
   STATE + UI (hand cursor with hover-to-select)
   ===================================================================== */
let state='menu',stateT=0,lock=.5,exitHold=0,ptr={on:false};
let buttons=[],hov={id:null,t:0};
const mouse={x:-1,y:-1,t:-99};
const kb={down:false};
let base=null;
const cal={samples:[],msg:'',prog:0,ok:false};
let cdLast=-1;

function go(s){state=s;stateT=0;lock=.6;hov={id:null,t:0};cdLast=-1;
  if(!s.startsWith('fs'))fsSetPoses(1);}
function addBtn(id,x,y,w,h,on=true,noHand=false){buttons.push({id,x,y,w,h,on,noHand});}
const inRect=(p,x,y,w,h)=>p.on&&p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h;
function pointer(t){
  if(t-mouse.t<4)return{x:mouse.x,y:mouse.y,on:true,src:'mouse'};
  if(camMode()&&tracked(t)&&P.curOk)return{x:clamp(P.cur.x,0,1)*W,y:clamp(P.cur.y,0,1)*H,on:true,src:'hand'};
  return{on:false};
}
function updateUI(dt,t){
  ptr=pointer(t);
  let h=null;
  if(ptr.on)for(const b of buttons)if(b.on&&!(b.noHand&&ptr.src==='hand')&&inRect(ptr,b.x,b.y,b.w,b.h)){h=b;break;}
  if(!h||lock>0){hov={id:null,t:0};return;}
  if(hov.id!==h.id)hov={id:h.id,t:0};
  hov.t+=dt;
  if(hov.t>=CFG.dwell){const id=h.id;hov={id:null,t:0};press(id);}
}
const prog=id=>hov.id===id?clamp(hov.t/CFG.dwell,0,1):0;
function press(id){
  sfx.select();
  if(id==='game:runner'||id==='again')startFlow();
  else if(id==='game:racer'||id==='rc:lobby')rcEnterLobby();
  else if(id==='game:slice'||id==='fs:again')startSlice();
  else if(id==='rc:wifi')rcSetupWifi();
  else if(id==='rc:start'||id==='rc:again')rcStartRace();
  else if(id==='menu')go('menu');
}
function startFlow(){
  resetRun();
  if(camMode()){base=null;cal.samples=[];cal.prog=0;cal.msg='';go('calib');}
  else go('countdown');
}

/* =====================================================================
   MAKER RUN: game logic
   ===================================================================== */
const R={};
function resetRun(){
  Object.assign(R,{t:0,pos:0,speed:14,score:0,gears:0,lives:CFG.lives,lane:0,laneX:0,h:0,jumpT:-1,
    duckPose:false,duck:false,duckAmt:0,jumpLatch:false,inv:0,shake:0,flash:0,phase:0,items:[],decor:[],
    nextAt:45,decNext:5,lastType:'',lostT:0,over:'',best:[]});
}
resetRun();
function jump(){if(R.jumpT>=0)return;R.jumpT=0;sfx.jump();}
function spawnRow(){
  const at=R.nextAt,lanes=[-1,0,1];
  let r=Math.random(),type=r<.34?'block':r<.62?'jump':r<.82?'duck':'gears';
  if(type===R.lastType&&type!=='gears')type='gears';
  if(type==='block'){
    const sh=shuffle(lanes),n=Math.random()<.5?1:2;
    sh.slice(0,n).forEach(l=>R.items.push({k:'block',lane:l,wz:at}));
    if(Math.random()<.6)for(let i=0;i<3;i++)R.items.push({k:'gear',lane:sh[n],wz:at-4+i*4,high:false});
  }else if(type==='jump'){
    const ls=shuffle(lanes).slice(0,1+Math.floor(Math.random()*3));
    ls.forEach(l=>R.items.push({k:'jump',lane:l,wz:at}));
    R.items.push({k:'gear',lane:ls[0],wz:at,high:true});
  }else if(type==='duck'){
    R.items.push({k:'duck',lane:0,wz:at});
  }else{
    const l=lanes[Math.floor(Math.random()*3)];
    for(let i=0;i<5;i++)R.items.push({k:'gear',lane:l,wz:at+i*3.5,high:false});
  }
  R.lastType=type;
  R.nextAt+=R.speed*rand(1.0,1.5)+6;
}
function poseInput(){
  const up=(base.sy-P.sy)/base.torso,down=(P.sy-base.sy)/base.torso;
  if(up>CFG.jumpUp&&!R.jumpLatch){jump();R.jumpLatch=true;}
  if(up<CFG.jumpUp*.45)R.jumpLatch=false;
  if(!R.duckPose&&down>CFG.duckDown)R.duckPose=true;
  else if(R.duckPose&&down<CFG.duckRelease)R.duckPose=false;
  const sl=P.hasHips?P.lean/CFG.leanOn:0,sd=(P.sx-base.sx)/base.shW/CFG.stepOn;
  const s=Math.abs(sl)>Math.abs(sd)?sl:sd;
  if(s<-1)R.lane=-1;else if(s>1)R.lane=1;else if(Math.abs(s)<.5)R.lane=0;
}
function hurt(){
  if(R.inv>0)return;
  R.lives--;R.inv=1.4;R.shake=.4;R.flash=1;sfx.hit();
  if(R.lives<=0)endRun('Out of power');
}
function endRun(reason){
  R.over=reason;R.score=Math.floor(R.pos)+R.gears*25;
  try{const a=JSON.parse(localStorage.getItem('sl_runner_best')||'[]');a.push(R.score);a.sort((x,y)=>y-x);
      R.best=a.slice(0,5);localStorage.setItem('sl_runner_best',JSON.stringify(R.best));}catch(e){R.best=[R.score];}
  sfx.over();go('over');
}
function loadBest(){try{return JSON.parse(localStorage.getItem('sl_runner_best')||'[]');}catch(e){return[];}}

function updateRun(dt,t){
  if(camMode()){
    if(!tracked(t)){R.lostT+=dt;if(R.lostT>12)go('menu');return;}
    R.lostT=0;poseInput();
  }
  R.duck=R.duckPose||kb.down;
  R.t+=dt;R.speed=14+Math.min(14,R.t*.25);R.pos+=R.speed*dt;R.phase+=dt*R.speed*.55;
  R.laneX=lerp(R.laneX,R.lane,1-Math.exp(-dt*12));
  if(R.jumpT>=0){R.jumpT+=dt;const u=R.jumpT/.78;if(u>=1){R.jumpT=-1;R.h=0;}else R.h=4*u*(1-u);}
  R.duckAmt=lerp(R.duckAmt,R.duck&&R.jumpT<0?1:0,1-Math.exp(-dt*14));
  while(R.nextAt<R.pos+75)spawnRow();
  while(R.decNext<R.pos+85){
    for(const side of [-1,1])R.decor.push({side,wz:R.decNext+rand(0,3),k:['bench','shelf','pillar','bench'][Math.floor(Math.random()*4)]});
    R.decNext+=rand(7,12);
  }
  for(const it of R.items){
    if(it.done)continue;const d=it.wz-R.pos;if(d>.7||d<-.9)continue;
    const ov=it.k==='duck'||Math.abs(it.lane-R.laneX)<.62;
    if(it.k==='gear'){
      if(Math.abs(it.lane-R.laneX)<.7&&(!it.high||R.h>.35)){it.done=true;R.gears++;sfx.gear();}
    }else if(ov){
      let hit=false;
      if(it.k==='block')hit=true;
      else if(it.k==='jump')hit=R.h<.5;
      else if(it.k==='duck')hit=R.duckAmt<.6;
      if(hit){it.done=true;hurt();}
    }
  }
  R.items=R.items.filter(it=>it.wz-R.pos>-3);
  R.decor=R.decor.filter(d=>d.wz-R.pos>-3);
  R.inv=Math.max(0,R.inv-dt);R.shake=Math.max(0,R.shake-dt);R.flash=Math.max(0,R.flash-dt*2.2);
  R.score=Math.floor(R.pos)+R.gears*25;
  if(R.t>=CFG.roundSeconds)endRun('Shift complete');
}

function updateCalib(dt,t){
  const asp=video.videoWidth/video.videoHeight||16/9;
  let msg='',ok=false;
  if(!tracked(t))msg='Step into the frame';
  else if(!P.hasHips)msg='Step back until your shoulders and hips are visible';
  else if(P.shW<.10)msg='Step closer';
  else if(P.shW>.36)msg='Step back';
  else if(Math.abs(P.sx-asp/2)>.2*asp)msg='Move to the middle of the frame';
  else ok=true;
  if(!ok){cal.samples=[];cal.prog=0;cal.msg=msg;cal.ok=false;return;}
  cal.samples.push({t,sx:P.sx,sy:P.sy,torso:P.torso,shW:P.shW});
  while(cal.samples.length&&cal.samples[0].t<t-1.5)cal.samples.shift();
  const rng=k=>{let a=1e9,b=-1e9;for(const s of cal.samples){a=Math.min(a,s[k]);b=Math.max(b,s[k]);}return b-a;};
  cal.ok=true;
  if(rng('sy')>.03||rng('sx')>.04){cal.samples=[cal.samples[cal.samples.length-1]];cal.prog=0;cal.msg='Hold still';return;}
  const span=t-cal.samples[0].t;cal.prog=clamp(span/1.2,0,1);cal.msg='Hold still';
  if(span>=1.2){
    const n=cal.samples.length,av=k=>cal.samples.reduce((a,s)=>a+s[k],0)/n;
    base={sx:av('sx'),sy:av('sy'),torso:av('torso'),shW:av('shW')};
    sfx.select();go('countdown');
  }
}

/* =====================================================================
   CIRCUIT RACERS: phones are the steering wheels (PeerJS), pseudo-3D road
   Phone page: controller.html. Players scan the QR code in the lobby.
   ===================================================================== */
const RC_STATES=['lobby','rcount','race','rresult'];
const RCC={
  laps:3, segLen:200, roadW:2000, camH:1000, fov:100, drawN:130, lanes:3,
  maxSpeed:8000, total:6, maxHumans:4,
  colors:['#35e0ff','#ff8a1f','#4dff9a','#ff5fd0'],
  botColors:['#c9d6ea','#ffd23f','#9b8cff','#ff4d5e','#7ee0c3','#f08a5d'],
  botNames:['Volt','Servo','Bolt','Gizmo','Pixel','Relay'],
  endGrace:20            // seconds the others get after the first human finishes
};
RCC.camD=1/Math.tan(RCC.fov/2*Math.PI/180);
RCC.playerZ=RCC.camH*RCC.camD*1.3;
RCC.accel=RCC.maxSpeed/4.5; RCC.brakeA=-RCC.maxSpeed*1.1; RCC.decel=-RCC.maxSpeed/6;
RCC.offDecel=-RCC.maxSpeed/2.2; RCC.offLimit=RCC.maxSpeed/4; RCC.centrif=.13;
const ORD=['1st','2nd','3rd','4th','5th','6th'];
const fmtT=s=>{const m=Math.floor(s/60);return `${m}:${(s-m*60).toFixed(2).padStart(5,'0')}`;};
const rc={segs:[],len:0,N:0,cars:[],t:0,firstFin:null,cdLast:-1,bcast:0,best:null};
rc.best=(()=>{try{return JSON.parse(localStorage.getItem('sl_racer_best')||'null');}catch(e){return null;}})();
const rcKeys={l:0,r:0,g:0,b:0,n:0};

/* ---------------- network: host side ---------------- */
const NET={peer:null,id:null,ready:false,err:'',url:'',slots:[null,null,null,null],tries:0,lastTry:0};
const SIGNAL=(()=>{const s=new URLSearchParams(location.search).get('signal');if(!s)return null;
  const[h,p,sec]=s.split(':');return{host:h,port:+p||9000,secure:sec==='1'||sec==='s',path:'/'};})();
let rcQR=null,rcWifiQR=null,rcWifi=null;
/* Optional Wi-Fi QR so phones can join the venue network first. Saved only in this browser (press W in the lobby),
   never in the repo, so the password is not published. */
function rcLoadWifi(){
  try{rcWifi=JSON.parse(localStorage.getItem('sl_wifi')||'null');}catch(e){rcWifi=null;}
  rcWifiQR=null;if(!rcWifi||!rcWifi.ssid)return;
  const esc=s=>String(s).replace(/([\\;,:"])/g,'\\$1');
  rcWifiQR=rcQRCanvas(`WIFI:T:${rcWifi.pass?'WPA':'nopass'};S:${esc(rcWifi.ssid)};${rcWifi.pass?'P:'+esc(rcWifi.pass)+';':''};`);
}
function rcSetupWifi(){
  const cur=rcWifi||{ssid:'SL-BYOD',pass:''};
  const ssid=prompt('Wi-Fi name for the QR code (leave empty to remove it):',cur.ssid);
  if(ssid===null)return;
  if(!ssid.trim()){try{localStorage.removeItem('sl_wifi');}catch(e){}rcLoadWifi();return;}
  const pass=prompt('Wi-Fi password (empty for an open network). Saved only in this browser:','');
  if(pass===null)return;
  try{localStorage.setItem('sl_wifi',JSON.stringify({ssid:ssid.trim(),pass}));}catch(e){}
  rcLoadWifi();
}
function rcQRCanvas(text){
  try{
    const q=qrcode(0,'M');q.addData(text);q.make();
    const n=q.getModuleCount(),s=10,pad=3,c=document.createElement('canvas');
    c.width=c.height=(n+pad*2)*s;const g=c.getContext('2d');
    g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.fillStyle='#050b16';
    for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))g.fillRect((k+pad)*s,(r+pad)*s,s,s);
    return c;
  }catch(e){return null;}
}
function rcMakeQR(url){rcQR=rcQRCanvas(url);if(!rcQR)NET.err='Could not draw the QR code';}
function netInit(){
  if(NET.peer)return;
  if(typeof Peer==='undefined'){NET.err='Network library not loaded. Check the internet connection.';return;}
  const p=NET.peer=new Peer('sl'+Math.random().toString(36).slice(2,8),SIGNAL?{...SIGNAL}:{});
  p.on('open',id=>{
    NET.id=id;NET.ready=true;NET.err='';
    const u=new URL('controller.html',location.href);u.search='';u.hash='';u.searchParams.set('h',id);
    if(SIGNAL)u.searchParams.set('signal',new URLSearchParams(location.search).get('signal'));
    NET.url=u.href;rcMakeQR(NET.url);
  });
  p.on('connection',netAccept);
  p.on('disconnected',()=>{NET.ready=false;setTimeout(()=>{try{p.reconnect();}catch(e){}},1500);});
  p.on('error',e=>{
    if(e.type==='unavailable-id'){NET.peer=null;netInit();}
    else if(e.type!=='peer-unavailable'){
      NET.err='Network problem: '+e.type+'. Retrying…';NET.ready=false;
      try{p.destroy();}catch(_){}NET.peer=null;setTimeout(()=>{if(state==='lobby')netInit();},3000);
    }
  });
}
function netAccept(conn){
  NET.tries++;NET.lastTry=performance.now();
  conn.on('data',d=>netData(conn,d));
  conn.on('close',()=>netDrop(conn));
  conn.on('error',()=>netDrop(conn));
}
const netSlotOf=conn=>NET.slots.find(s=>s&&s.conn===conn);
function netSeat(conn){
  const racing=state==='rcount'||state==='race';
  let s=NET.slots.find(x=>x&&!x.conn&&x.inRace);          // reclaim a seat vacated mid-race
  if(s){s.conn=conn;s.last=performance.now();return s;}
  if(racing)return null;
  const i=NET.slots.findIndex(x=>!x);if(i<0)return null;
  return NET.slots[i]={i,conn,name:'P'+(i+1),color:RCC.colors[i],in:{s:0,g:0,b:0,n:0},last:performance.now(),inRace:false};
}
function netDrop(conn){
  const s=netSlotOf(conn);if(!s)return;
  if(s.inRace&&(state==='rcount'||state==='race'))s.conn=null;   // keep the seat for a reconnect
  else NET.slots[s.i]=null;
}
function netData(conn,d){
  if(!d||typeof d!=='object')return;
  let s=netSlotOf(conn);
  if(d.t==='hello'){
    if(s)return;
    s=netSeat(conn);
    if(!s){try{conn.send({t:'full'});}catch(e){}setTimeout(()=>{try{conn.close();}catch(e){}},600);return;}
    try{conn.send({t:'welcome',slot:s.i,color:s.color,name:s.name});}catch(e){}
    sfx.select();
    const c=rc.cars.find(c=>c.slot===s.i);                          // rejoining a race in progress
    if(c&&(state==='race'||state==='rcount')){c.human=true;c.ai=null;}
    return;
  }
  if(!s)return;
  s.last=performance.now();
  if(d.t==='in'){s.in.s=clamp(+d.s||0,-1,1);s.in.g=d.g?1:0;s.in.b=d.b?1:0;s.in.n=d.n?1:0;}
  else if(d.t==='start'&&s.i===netFirst()&&(state==='lobby'||state==='rresult'))rcStartRace();
  else if(d.t==='menu'&&s.i===netFirst()&&RC_STATES.includes(state))go('menu');
}
const netFirst=()=>{const s=NET.slots.find(x=>x&&x.conn);return s?s.i:-1;};
const netCount=()=>NET.slots.filter(x=>x&&x.conn).length;
function netSend(s,o){try{if(s&&s.conn&&s.conn.open)s.conn.send(o);}catch(e){}}
function netTick(dt){
  const now=performance.now();
  for(const s of NET.slots)if(s&&s.conn&&now-s.last>6000){try{s.conn.close();}catch(e){}netDrop(s.conn);}
  rc.bcast-=dt;
  if(rc.bcast>0)return;rc.bcast=.1;
  const first=netFirst();
  for(const s of NET.slots){
    if(!s||!s.conn)continue;
    const c=rc.cars.find(c=>c.slot===s.i&&c.human);
    const m={t:'s',ph:state,first:s.i===first,of:rc.cars.length||RCC.total,laps:RCC.laps,
      cd:Math.max(0,3.7-stateT),lap:1,pos:1,spd:0,n:0};
    if(c&&(state!=='lobby')){
      m.lap=Math.min(RCC.laps,c.lapN+1);m.pos=c.pos;m.spd=Math.round(c.speed/RCC.maxSpeed*240);m.n=c.nitro;
      if(c.finished){m.fin=1;m.ft=fmtT(c.finT);}
      if(state==='rresult'){m.ft=c.finished?fmtT(c.finT):'Did not finish';}
    }
    netSend(s,m);
  }
}

/* ---------------- track ---------------- */
function rcBuildTrack(){
  const SL=RCC.segLen,K=1,segs=rc.segs=[];let lastY=0;
  const ease=(a,b,p)=>a+(b-a)*(-Math.cos(p*Math.PI)/2+.5);
  const addSeg=(curve,y)=>{segs.push({i:segs.length,y0:lastY,y1:y,curve,sprites:[],cars:[],clip:0,vis:false,
    a:{sx:0,sy:0,sc:0,sw:0,z:0},b:{sx:0,sy:0,sc:0,sw:0,z:0}});lastY=y;};
  const road=(en,ho,le,curve,dy)=>{
    en*=K;ho*=K;le*=K;const sy=lastY,ey=sy+dy*SL*.6,tot=en+ho+le;let n;
    for(n=0;n<en;n++)addSeg(curve*(n/en)*(n/en),ease(sy,ey,n/tot));
    for(n=0;n<ho;n++)addSeg(curve,ease(sy,ey,(en+n)/tot));
    for(n=0;n<le;n++){const p=n/le;addSeg(curve*(1-p)*(1-p),ease(sy,ey,(en+ho+n)/tot));}
  };
  road(25,25,25,0,0);
  road(20,30,20,0,22);
  road(25,40,25,3,0);
  road(20,30,20,0,-22);
  road(25,25,25,-4,0);
  road(25,25,25,5,0);
  road(15,40,15,0,0);
  road(30,35,30,-3,18);
  road(25,25,25,0,-18);
  road(15,25,15,6,0);
  road(15,25,15,-6,0);
  road(20,40,20,2,0);
  road(25,35,25,0,-lastY/SL/.6);
  segs[segs.length-1].y1=0;
  rc.N=segs.length;rc.len=rc.N*SL;
  // pylons along both sides
  for(const s of segs)if(s.i%6===0){const c=(s.i/6)%2?'#35e0ff':'#ff8a1f';
    s.sprites.push({type:'pylon',o:-1.28,c},{type:'pylon',o:1.28,c});}
  // toolbox obstacles and gear pickups, same layout every lap
  const lanes=[-.55,0,.55];let i=34,lastLane=1;
  while(i<rc.N-40){
    const L1=(lastLane+1+Math.floor(Math.random()*2))%3;lastLane=L1;
    const crate=(idx,l)=>segs[idx].sprites.push({type:'crate',o:lanes[l],taken:{}});
    crate(i,L1);if(Math.random()<.4)crate(i,(L1+1)%3);
    const gl=(L1+2)%3;
    for(let k=0;k<4;k++)segs[i+11+k*3].sprites.push({type:'gear',o:lanes[gl],taken:{}});
    i+=30+Math.floor(Math.random()*14);
  }
}
const rcSegAt=z=>rc.segs[Math.floor((((z%rc.len)+rc.len)%rc.len)/RCC.segLen)];

/* ---------------- cars ---------------- */
function rcNewCar(id,slot,human,name,color){
  return{id,slot,human,name,color,z:0,pz:0,x:0,speed:0,nitro:.3,steer:0,gas:0,brake:0,nb:0,boosting:false,crash:0,
    lapN:0,lapStart:0,lapTimes:[],finished:false,finT:0,pos:1,gears:0,bgx:0,ai:null,hitFlash:0,bounce:0};
}
function rcMakeAI(c){c.ai={lane:rand(-.6,.6),target:0,pace:rand(.8,.94),nbT:0};}
function rcStartRace(){
  rcBuildTrack();
  for(const s of NET.slots)if(s&&!s.conn)NET.slots[s.i]=null;
  const cars=[];let id=0;
  for(const s of NET.slots)if(s&&s.conn){s.inRace=true;cars.push(rcNewCar(id++,s.i,true,s.name,s.color));}
  if(!cars.length)cars.push(rcNewCar(id++,-1,true,'Keyboard',RCC.colors[0]));
  const bots=Math.max(2,RCC.total-cars.length);
  for(let b=0;b<bots;b++){const c=rcNewCar(id++,-2,false,RCC.botNames[b%6],RCC.botColors[b%6]);rcMakeAI(c);cars.push(c);}
  const order=shuffle(cars);
  order.forEach((c,k)=>{const row=k>>1,col=k&1;c.x=col?.45:-.45;c.z=-(row*700)-col*250;c.pz=c.z;c.lapN=0;});
  rc.cars=cars;rc.t=0;rc.firstFin=null;rc.cdLast=-1;
  rcBin();rcRank();
  sfx.select();go('rcount');
}
function rcBin(){
  for(const s of rc.segs)s.cars.length=0;
  for(const c of rc.cars)rcSegAt(c.z).cars.push(c);
}
function rcRank(){
  const r=rc.cars.slice().sort((a,b)=>(b.finished-a.finished)||(a.finished&&b.finished?a.finT-b.finT:b.z-a.z));
  r.forEach((c,i)=>c.pos=i+1);return r;
}
function rcBuzz(c,ms){if(c.human&&c.slot>=0)netSend(NET.slots[c.slot],{t:'buzz',ms});}

function rcControl(c,dt,now){
  if(c.finished){c.gas=0;c.brake=.3;c.nb=0;c.steer*=.9;if(c.ai)rcAI(c,dt,true);return;}
  if(!c.human){rcAI(c,dt,false);return;}
  if(c.slot===-1){                                     // keyboard player
    const t=rcKeys.r-rcKeys.l;c.steer+=clamp(t-c.steer,-5*dt,5*dt);
    c.gas=rcKeys.g;c.brake=rcKeys.b;c.nb=rcKeys.n;return;
  }
  const s=NET.slots[c.slot];
  if(!s||!s.conn){rcMakeAI(c);c.human=false;return;}       // phone dropped: a CPU takes the wheel
  if(now-s.last>1500){c.steer*=.9;c.gas=0;c.brake=0;c.nb=0;return;}
  c.steer=s.in.s;c.gas=s.in.g;c.brake=s.in.b;c.nb=s.in.n;
}
function rcAI(c,dt,parked){
  const a=c.ai;if(!a)return;
  const SL=RCC.segLen;let want=a.lane,danger=false;
  for(let k=1;k<=9;k++){
    const s=rcSegAt(c.z+k*SL);
    for(const sp of s.sprites){
      if(sp.type==='crate'&&Math.abs(sp.o-c.x)<.36){want=clamp(c.x+(c.x>=sp.o?.5:-.5),-.8,.8);danger=true;}
      else if(sp.type==='gear'&&!danger&&k<6&&Math.abs(sp.o-c.x)<.8)want=sp.o;
    }
    for(const o of s.cars)if(o!==c&&Math.abs(o.x-c.x)<.34&&k<6){want=clamp(c.x+(c.x>=o.x?.45:-.45),-.8,.8);danger=true;}
  }
  a.target+= (want-a.target)*Math.min(1,dt*4);
  const seg=rcSegAt(c.z);
  c.steer=clamp((a.target-c.x)*2.4,-1,1);
  // rubber band toward the humans so the pack stays close
  let hz=0,n=0;for(const o of rc.cars)if(o.human){hz+=o.z;n++;}
  const gap=n?c.z-hz/n:0;
  const pace=clamp(a.pace+(gap<-3000?.06:0)-(gap>5000?.08:0),.6,1);
  const sp=c.speed/RCC.maxSpeed;
  c.gas=(sp<pace&&!(Math.abs(seg.curve)>=5&&sp>.82))?1:0;
  c.brake=(sp>pace+.1)?1:0;
  a.nbT-=dt;
  if(!parked&&a.nbT<=0){a.nbT=rand(2,5);c.nb=(c.nitro>.55&&Math.abs(seg.curve)<2&&Math.random()<.7)?1:0;}
  if(c.nitro<.1)c.nb=0;
  if(parked){c.gas=0;c.nb=0;}
}
function rcPhys(c,dt){
  const R=RCC,seg=rcSegAt(c.z);
  c.boosting=!!(c.nb&&c.nitro>.02&&c.speed>R.maxSpeed*.3&&!c.finished);
  if(c.boosting)c.nitro=Math.max(0,c.nitro-dt*.25);else c.nitro=Math.min(1,c.nitro+dt*.012);
  const cap=R.maxSpeed*(c.boosting?1.35:1);
  let a=c.gas?R.accel*(c.boosting?2.4:1):R.decel;
  if(c.brake)a+=R.brakeA;
  if(Math.abs(c.x)>1.02&&c.speed>R.offLimit)a+=R.offDecel;
  c.speed+=a*dt;
  if(c.speed>cap)c.speed=c.boosting?cap:Math.max(R.maxSpeed,c.speed-R.maxSpeed*.5*dt);
  c.speed=Math.max(0,c.speed);
  const sp=c.speed/R.maxSpeed,dx=dt*2*Math.min(1,sp+.1);
  c.x+=dx*c.steer*1.4-dx*sp*seg.curve*R.centrif;
  c.x=clamp(c.x,-1.25,1.25);
  c.pz=c.z;c.z+=c.speed*dt;
  c.crash=Math.max(0,c.crash-dt);c.hitFlash=Math.max(0,c.hitFlash-dt);
  c.bgx+=seg.curve*sp*dt*260;
  c.bounce=Math.sin(c.z*.02)*(Math.abs(c.x)>1.02?1:.25)*sp;
}
function rcInteract(c){
  const SL=RCC.segLen,lap=Math.floor(c.z/rc.len);
  const i0=Math.floor(c.pz/SL),i1=Math.floor(c.z/SL);
  for(let i=i0;i<=i1;i++){
    const s=rc.segs[((i%rc.N)+rc.N)%rc.N];
    for(const sp of s.sprites){
      if(sp.type==='pylon'||sp.taken[c.id]===lap)continue;
      if(Math.abs(c.x-sp.o)<(sp.type==='crate'?.26:.3)){
        sp.taken[c.id]=lap;
        if(sp.type==='crate'){c.speed=Math.min(c.speed,RCC.maxSpeed*.22);c.crash=.8;c.hitFlash=.5;c.nitro=Math.max(0,c.nitro-.08);
          if(c.human){sfx.hit();rcBuzz(c,220);}}
        else{c.gears++;c.nitro=Math.min(1,c.nitro+.22);if(c.human){sfx.gear();rcBuzz(c,25);}}
      }
    }
  }
}
function rcCollide(){
  const cs=rc.cars;
  for(let i=0;i<cs.length;i++)for(let j=i+1;j<cs.length;j++){
    const a=cs[i],b=cs[j],dz=a.z-b.z;
    if(Math.abs(dz)<520&&Math.abs(a.x-b.x)<.3){
      const f=dz>=0?a:b,r=dz>=0?b:a;                           // front / rear
      r.speed=Math.min(r.speed,f.speed*.92);
      r.z=Math.min(r.z,f.z-520);
      const push=(a.x>=b.x?1:-1)*.012;a.x+=push;b.x-=push;
      if(r.human&&r.hitFlash<=0){r.hitFlash=.25;sfx.hit();rcBuzz(r,60);}
    }
  }
}
function rcLaps(c){
  const lap=Math.floor(c.z/rc.len);
  if(lap>c.lapN&&lap>=1&&!c.finished){
    const lt=rc.t-c.lapStart;c.lapTimes.push(lt);c.lapStart=rc.t;c.lapN=lap;
    if(c.human&&(!rc.best||lt<rc.best.t)){rc.best={t:lt,name:c.name};try{localStorage.setItem('sl_racer_best',JSON.stringify(rc.best));}catch(e){}}
    if(lap>=RCC.laps){
      c.finished=true;c.finT=rc.t;
      if(c.human){sfx.gear();rcBuzz(c,400);if(rc.firstFin===null)rc.firstFin=rc.t;}
    }else if(c.human)sfx.tick();
  }
}
function rcEnterLobby(){
  for(const s of NET.slots)if(s&&!s.conn)NET.slots[s.i]=null;
  for(const s of NET.slots)if(s)s.inRace=false;
  rc.cars=[];netInit();rcLoadWifi();go('lobby');
}
function rcEnd(){
  rcRank();
  const hs=rc.cars.filter(c=>c.human);
  if(hs.length)sfx.over();
  go('rresult');
}

function rcUpdate(dt,t){
  netTick(dt);
  const now=performance.now();
  if(state==='lobby'||state==='rresult'){
    if(state==='lobby'&&!NET.peer)netInit();
    return;
  }
  if(state==='rcount'){
    const n=Math.floor(stateT);if(n!==rc.cdLast&&n<=3){rc.cdLast=n;if(n<3)sfx.tick();else sfx.go();}
    if(stateT>3.7){state='race';stateT=0;rc.t=0;}
    return;
  }
  // state === 'race'
  rc.t+=dt;
  for(const c of rc.cars){rcControl(c,dt,now);rcPhys(c,dt);rcInteract(c);}
  rcCollide();
  for(const c of rc.cars)rcLaps(c);
  rcBin();rcRank();
  const hs=rc.cars.filter(c=>c.human);
  if(!hs.length)return rcEnterLobby();
  if(hs.every(c=>c.finished)||(rc.firstFin!==null&&rc.t-rc.firstFin>RCC.endGrace)||rc.t>900)rcEnd();
}

/* ---------------- drawing: world ---------------- */
const rcSky=Array.from({length:70},()=>({x:Math.random(),y:Math.random()*.5,r:rand(.6,1.8)}));
const rcCity=(()=>{const a=[];let x=0;while(x<2.4){const w=rand(.025,.07),h=rand(.04,.2);a.push({x,w,h,ant:Math.random()<.2,lit:Math.random()});x+=w+rand(0,.015);}return{b:a,w:x};})();
let RV={w:1920,h:1080};
function poly(x1,y1,x2,y2,x3,y3,x4,y4,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.lineTo(x4,y4);ctx.closePath();ctx.fill();}

function rcBackdrop(v,vw,vh,t){
  const hor=vh/2;
  const g=ctx.createLinearGradient(0,0,0,hor);g.addColorStop(0,'#030816');g.addColorStop(1,'#10305c');
  ctx.fillStyle=g;ctx.fillRect(0,0,vw,hor+2);
  ctx.fillStyle='#07142a';ctx.fillRect(0,hor,vw,vh-hor);
  const off=v.bgx*(vw/1920);
  ctx.fillStyle='#bfe9ff';
  for(const s of rcSky){const x=(((s.x*vw-off*.15)%vw)+vw)%vw;ctx.globalAlpha=.3+s.r*.25;ctx.beginPath();ctx.arc(x,s.y*hor*1.6,s.r*vw/1400+.4,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  // planet with a ring
  const px=(((vw*.72-off*.08)%(vw*1.4))+vw*1.4)%(vw*1.4)-vw*.2,pr=vh*.12;
  const pg=ctx.createRadialGradient(px-pr*.3,hor*.45-pr*.3,pr*.1,px,hor*.45,pr);pg.addColorStop(0,'#ffb865');pg.addColorStop(1,'#a03a1c');
  ctx.fillStyle=pg;ctx.beginPath();ctx.arc(px,hor*.45,pr,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,210,63,.55)';ctx.lineWidth=Math.max(2,pr*.08);ctx.beginPath();ctx.ellipse(px,hor*.45,pr*1.7,pr*.32,-.25,0,7);ctx.stroke();
  // station skyline, wraps sideways as the road bends
  const cw=rcCity.w*vw,sx=((-off*.6)%cw+cw)%cw;
  for(let rep=-1;rep<=1;rep++)for(const b of rcCity.b){
    const x=b.x*vw-sx+rep*cw;if(x>vw||x+b.w*vw<0)continue;
    const bh=b.h*vh;ctx.fillStyle='#0a1a34';ctx.fillRect(x,hor-bh,b.w*vw,bh+1);
    ctx.fillStyle=b.lit>.5?'rgba(53,224,255,.55)':'rgba(255,138,31,.55)';
    ctx.fillRect(x+b.w*vw*.2,hor-bh+bh*.2,Math.max(2,b.w*vw*.12),Math.max(2,bh*.05));
    if(b.ant){ctx.fillStyle='#0a1a34';ctx.fillRect(x+b.w*vw*.48,hor-bh-vh*.05,Math.max(2,vw*.003),vh*.05);
      ctx.fillStyle=(t*2+b.lit*9)%2<1?'#ff4d5e':'#400';ctx.fillRect(x+b.w*vw*.46,hor-bh-vh*.055,Math.max(3,vw*.005),Math.max(3,vw*.005));}
  }
  const hg=ctx.createLinearGradient(0,hor-vh*.05,0,hor+vh*.04);hg.addColorStop(0,'rgba(53,224,255,0)');hg.addColorStop(.5,'rgba(53,224,255,.22)');hg.addColorStop(1,'rgba(53,224,255,0)');
  ctx.fillStyle=hg;ctx.fillRect(0,hor-vh*.05,vw,vh*.09);
}

function rcCarShape(cx,by,w,col,o){
  const h=w*.62;
  ctx.save();ctx.translate(cx,by);if(o.lean)ctx.rotate(o.lean);
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(0,0,w*.54,w*.08,0,0,7);ctx.fill();
  ctx.fillStyle='#070b14';ctx.fillRect(-w*.5,-h*.46,w*.16,h*.46);ctx.fillRect(w*.34,-h*.46,w*.16,h*.46);
  ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(-w*.45,-h*.66,w*.9,h*.44,w*.07);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(-w*.45,-h*.3,w*.9,h*.08);
  ctx.fillStyle='#0d1f3d';ctx.beginPath();ctx.moveTo(-w*.31,-h*.66);ctx.lineTo(-w*.22,-h*.98);ctx.lineTo(w*.22,-h*.98);ctx.lineTo(w*.31,-h*.66);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.14)';ctx.beginPath();ctx.moveTo(-w*.26,-h*.7);ctx.lineTo(-w*.2,-h*.93);ctx.lineTo(-w*.04,-h*.93);ctx.lineTo(-w*.1,-h*.7);ctx.closePath();ctx.fill();
  ctx.fillStyle=col;ctx.fillRect(-w*.5,-h*1.08,w,h*.08);ctx.fillRect(-w*.34,-h*1.04,w*.05,h*.16);ctx.fillRect(w*.29,-h*1.04,w*.05,h*.16);
  ctx.fillStyle=o.brake?'#ff8a8f':'#ff2a3a';ctx.fillRect(-w*.41,-h*.55,w*.22,h*.12);ctx.fillRect(w*.19,-h*.55,w*.22,h*.12);
  if(o.brake){ctx.globalAlpha=.35;ctx.fillRect(-w*.46,-h*.6,w*.32,h*.22);ctx.fillRect(w*.14,-h*.6,w*.32,h*.22);ctx.globalAlpha=1;}
  ctx.fillStyle='#10131c';ctx.fillRect(-w*.3,-h*.4,w*.6,h*.1);
  if(o.flame){
    for(const sx of[-.2,.2]){
      const fl=h*(.35+Math.random()*.35);
      ctx.fillStyle='rgba(53,224,255,.9)';ctx.beginPath();ctx.moveTo(w*sx-w*.07,-h*.32);ctx.lineTo(w*sx+w*.07,-h*.32);ctx.lineTo(w*sx,-h*.32+fl);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(255,200,80,.95)';ctx.beginPath();ctx.moveTo(w*sx-w*.035,-h*.32);ctx.lineTo(w*sx+w*.035,-h*.32);ctx.lineTo(w*sx,-h*.32+fl*.6);ctx.closePath();ctx.fill();
    }
  }
  ctx.restore();
}
function rcDrawSprite(sp,x,y,k,clipY,t,c,v){
  // k = screen pixels per world unit at this depth
  let wH=1500;
  if(sp==='crate')wH=440;else if(sp==='gear')wH=760;else if(sp==='car')wH=420;
  if(k*640<1.5)return;
  const clipped=clipY<y;
  if(clipped){if(y-clipY>wH*k)return;ctx.save();ctx.beginPath();ctx.rect(0,0,RV.w,clipY);ctx.clip();}
  if(sp==='pylon'){
    const w=160*k,h=1500*k;
    ctx.fillStyle='#22314f';ctx.fillRect(x-w/2,y-h,w,h);
    ctx.fillStyle=c.c;ctx.fillRect(x-w/2,y-h*.55,w,h*.05);
    ctx.globalAlpha=.22;ctx.fillStyle=c.c;ctx.beginPath();ctx.arc(x,y-h,w*1.9,0,7);ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle=c.c;ctx.beginPath();ctx.arc(x,y-h,w*.95,0,7);ctx.fill();
  }else if(sp==='crate'){
    const w=560*k,h=440*k;
    ctx.fillStyle='#b8382c';ctx.fillRect(x-w/2,y-h,w,h);
    ctx.fillStyle='#d9594b';ctx.fillRect(x-w/2,y-h,w,h*.16);
    ctx.fillStyle='#ffd23f';ctx.fillRect(x-w/2,y-h*.58,w,h*.1);
    ctx.strokeStyle='#4a0f0a';ctx.lineWidth=Math.max(1,w*.03);ctx.strokeRect(x-w/2,y-h,w,h);
    ctx.fillStyle='#3a1210';ctx.fillRect(x-w*.15,y-h*1.12,w*.3,h*.12);
  }else if(sp==='gear'){
    const r=230*k,cy=y-300*k-r,rot=t*2;
    ctx.globalAlpha=.2;ctx.fillStyle=C.yellow;ctx.beginPath();ctx.arc(x,cy,r*1.7,0,7);ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle=C.yellow;ctx.beginPath();
    for(let i=0;i<32;i++){const a=rot+i/32*Math.PI*2,rad=(i%4<2)?r:r*.76;ctx.lineTo(x+Math.cos(a)*rad,cy+Math.sin(a)*rad);}
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#07142a';ctx.beginPath();ctx.arc(x,cy,r*.32,0,7);ctx.fill();
  }else if(sp==='car'){
    const w=540*k,lean=c.steer*.05*(c===v?1:.4);
    rcCarShape(x,y-Math.abs(c.bounce)*w*.02,w,c.color,{lean,brake:c.brake&&c.speed>100,flame:c.boosting});
    if(c.crash>0){ctx.fillStyle=`rgba(255,200,80,${c.crash})`;for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(x+rand(-.5,.5)*w,y-rand(0,.6)*w*.6,Math.max(1,w*.02),0,7);ctx.fill();}}
    if(c!==v&&w>46){const sz=clamp(w*.15,11,28);txt(c.name,x,y-w*.78,sz,c.color,'center',700);}
  }
  if(clipped)ctx.restore();
}

function rcView(v,vx,vy,vw,vh,t){
  const R=RCC,N=rc.N,L=rc.len,SL=R.segLen;
  ctx.save();ctx.beginPath();ctx.rect(vx,vy,vw,vh);ctx.clip();ctx.translate(vx,vy);
  RV.w=vw;RV.h=vh;
  const vwE=Math.min(vw,vh*16/9);          // projection width: wide, short views (2 players) keep a normal 16:9 field so obstacles stay visible
  const camZ=(((v.z-R.playerZ)%L)+L)%L,bi=Math.floor(camZ/SL),bseg=rc.segs[bi],bp=(camZ%SL)/SL;
  const pseg=rcSegAt(v.z),pp=(((v.z%SL)+SL)%SL)/SL;
  const camY=R.camH+lerp(pseg.y0,pseg.y1,pp)+v.bounce*40,camX=v.x*R.roadW;
  rcBackdrop(v,vw,vh,t);
  let x=0,dx=-(bseg.curve*bp),maxy=vh;
  for(let n=0;n<R.drawN;n++){
    const idx=bi+n,seg=rc.segs[idx%N],zoff=idx>=N?L:0;
    const z1=seg.i*SL+zoff-camZ,z2=z1+SL;
    const a=seg.a,b=seg.b;
    a.z=z1;b.z=z2;
    a.sc=R.camD/z1;b.sc=R.camD/z2;
    a.sx=Math.round(vw/2+a.sc*(x-camX)*vwE/2);b.sx=Math.round(vw/2+b.sc*(x+dx-camX)*vwE/2);
    a.sy=Math.round(vh/2-a.sc*(seg.y0-camY)*vh/2);b.sy=Math.round(vh/2-b.sc*(seg.y1-camY)*vh/2);
    a.sw=Math.round(a.sc*R.roadW*vwE/2);b.sw=Math.round(b.sc*R.roadW*vwE/2);
    x+=dx;dx+=seg.curve;
    seg.clip=maxy;seg.vis=z1>700;
    if(z1<=R.camD||b.sy>=a.sy||b.sy>=maxy)continue;
    const dark=(seg.i%6)<3,lap0=seg.i<2;
    const ground=dark?'#06162e':'#0a2041',roadC=lap0?(seg.i===0?'#e8f4ff':'#0b1424'):(dark?'#1b2b4d':'#16254a'),
          rumble=dark?'#ff8a1f':'#e8f4ff';
    ctx.fillStyle=ground;ctx.fillRect(0,b.sy,vw,a.sy-b.sy);
    const r1=a.sw/Math.max(6,2*R.lanes),r2=b.sw/Math.max(6,2*R.lanes);
    poly(a.sx-a.sw-r1,a.sy,a.sx-a.sw,a.sy,b.sx-b.sw,b.sy,b.sx-b.sw-r2,b.sy,rumble);
    poly(a.sx+a.sw+r1,a.sy,a.sx+a.sw,a.sy,b.sx+b.sw,b.sy,b.sx+b.sw+r2,b.sy,rumble);
    poly(a.sx-a.sw,a.sy,a.sx+a.sw,a.sy,b.sx+b.sw,b.sy,b.sx-b.sw,b.sy,roadC);
    if(dark&&!lap0){
      const l1=a.sw/Math.max(32,8*R.lanes),l2=b.sw/Math.max(32,8*R.lanes),lw1=a.sw*2/R.lanes,lw2=b.sw*2/R.lanes;
      let lx1=a.sx-a.sw+lw1,lx2=b.sx-b.sw+lw2;
      for(let l=1;l<R.lanes;l++){poly(lx1-l1/2,a.sy,lx1+l1/2,a.sy,lx2+l2/2,b.sy,lx2-l2/2,b.sy,'rgba(53,224,255,.7)');lx1+=lw1;lx2+=lw2;}
    }
    maxy=a.sy;
  }
  const vlap=Math.floor(v.z/L);
  for(let n=R.drawN-1;n>=0;n--){
    const seg=rc.segs[(bi+n)%N];if(!seg.vis)continue;
    const a=seg.a,b=seg.b,k=a.sc*vwE/2;
    for(const s of seg.sprites){
      if(a.z<1100||(s.type==='gear'&&s.taken[v.id]===vlap))continue;   // too close to the camera
      rcDrawSprite(s.type,a.sx+k*s.o*R.roadW,a.sy,k,seg.clip,t,s,v);
    }
    for(const c of seg.cars){
      const pct=(((c.z%SL)+SL)%SL)/SL,sc=lerp(a.sc,b.sc,pct),kk=sc*vwE/2;
      const cx=lerp(a.sx,b.sx,pct)+kk*c.x*R.roadW,cy=lerp(a.sy,b.sy,pct);
      rcDrawSprite('car',cx,cy,kk,seg.clip,t,c,v);
    }
  }
  rcViewHud(v,vw,vh,t);
  ctx.restore();
}

function rcViewHud(v,vw,vh,t){
  const u=Math.min(vw/960,vh/540),single=vw>1500&&vh>900;
  if(v.boosting){
    ctx.strokeStyle='rgba(180,240,255,.35)';ctx.lineWidth=2*u;ctx.beginPath();
    for(let i=0;i<22;i++){const a=i*0.2856+t*.7,r0=vh*(.3+((i*37)%10)/40),r1=r0+vh*.25;
      ctx.moveTo(vw/2+Math.cos(a)*r0*1.6,vh/2+Math.sin(a)*r0);ctx.lineTo(vw/2+Math.cos(a)*r1*1.6,vh/2+Math.sin(a)*r1);}
    ctx.stroke();
  }
  if(v.hitFlash>0){ctx.fillStyle=`rgba(255,77,94,${v.hitFlash*.4})`;ctx.fillRect(0,0,vw,vh);}
  // position + lap
  const po=ORD[v.pos-1]||v.pos+'th';
  txt(po,18*u,56*u,48*u,C.yellow,'left',700);
  txt('/ '+rc.cars.length,18*u+ctx.measureText(po).width+8*u,56*u,22*u,C.dim,'left',600);
  txt(`LAP ${Math.min(RCC.laps,v.lapN+1)}/${RCC.laps}`,vw-18*u,50*u,30*u,C.text,'right',700);
  txt(fmtT(Math.max(0,rc.t)),vw-18*u,82*u,22*u,C.dim,'right',600);
  // name chip
  const nm=v.name;ctx.font=`700 ${20*u}px ${FONT}`;const cw=ctx.measureText(nm).width+30*u;
  rr(vw/2-cw/2,12*u,cw,34*u,17*u);ctx.fillStyle='rgba(7,16,34,.78)';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=v.color;ctx.stroke();
  txt(nm,vw/2,36*u,20*u,v.color,'center',700);
  // speed + nitro
  txt(String(Math.round(v.speed/RCC.maxSpeed*240)),18*u,vh-22*u,52*u,C.text,'left',700);
  txt('km/h',18*u+(single?150:92)*u,vh-24*u,20*u,C.dim,'left',600);
  const bw=220*u,bx=vw-18*u-bw,by=vh-40*u;
  rr(bx,by,bw,18*u,9*u);ctx.fillStyle='rgba(255,255,255,.14)';ctx.fill();
  if(v.nitro>.01){rr(bx,by,bw*v.nitro,18*u,9*u);ctx.fillStyle=v.boosting?C.orange:C.cyan;ctx.fill();}
  txt('NITRO',bx,by-8*u,18*u,C.dim,'left',600);
  if(single)rcStandings(vw-300,128,282,34,24,v);
  if(rc.cars.length&&!single){ctx.lineWidth=4;ctx.strokeStyle=v.color;ctx.strokeRect(2,2,vw-4,vh-4);}
  // countdown / finish banners
  if(state==='rcount'){
    const n=3-Math.floor(stateT);
    ctx.fillStyle='rgba(3,8,18,.35)';ctx.fillRect(0,0,vw,vh);
    txt(n>0?String(n):'GO!',vw/2,vh/2+70*u,190*u,n>0?C.text:C.green,'center',700);
  }else if(state==='race'&&rc.t<4)txt('GO!',vw/2,vh*.38,120*u*(1-rc.t/4),C.green,'center',700);
  if(v.finished){
    ctx.fillStyle='rgba(3,8,18,.5)';ctx.fillRect(0,vh*.3,vw,vh*.3);
    txt(`${ORD[v.pos-1]||v.pos+'th'} place`,vw/2,vh*.45,72*u,C.yellow,'center',700);
    txt(fmtT(v.finT),vw/2,vh*.45+44*u,34*u,C.text,'center',600);
  }
}
function rcStandings(x,y,w,rowH,size,me){
  const r=rc.cars.slice().sort((a,b)=>a.pos-b.pos);
  r.forEach((c,i)=>{
    const yy=y+i*rowH;
    rr(x,yy,w,rowH-4,8);ctx.fillStyle=c===me?'rgba(255,210,63,.2)':'rgba(7,16,34,.72)';ctx.fill();
    ctx.fillStyle=c.color;ctx.beginPath();ctx.arc(x+18,yy+rowH/2-2,8,0,7);ctx.fill();
    txt(`${i+1}  ${c.name}`,x+38,yy+rowH/2+size*.3,size,C.text,'left',600);
    if(c.finished)txt(fmtT(c.finT),x+w-10,yy+rowH/2+size*.3,size*.8,C.yellow,'right',600);
  });
}
function rcViewRects(n){
  if(n<=1)return[[0,0,1920,1080]];
  if(n===2)return[[0,0,1920,538],[0,542,1920,538]];
  return[[0,0,958,538],[962,0,958,538],[0,542,958,538],[962,542,958,538]];
}
function rcDrawRace(t){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const hs=rc.cars.filter(c=>c.human).slice(0,4);
  const rects=rcViewRects(hs.length);
  hs.forEach((c,i)=>rcView(c,...rects[i],t));
  if(hs.length===3){                                  // fourth quadrant: standings
    const[x,y,w,h]=[962,542,958,538];
    ctx.fillStyle='#050b16';ctx.fillRect(x,y,w,h);
    txt('Standings',x+30,y+60,34,C.cyan,'left',700);
    rcStandings(x+30,y+84,w-60,60,28,null);
  }
}

/* ---------------- drawing: lobby + results ---------------- */
function rcDrawLobby(t){
  bgSpace(t);
  ctx.font=`700 92px ${FONT}`;const cw0=ctx.measureText('CIRCUIT ').width;

/* =====================================================================
   FILAMENT SLICE: swipe both hands (or the mouse) through flying parts.
   Up to 3 players side by side, each with their own score and lives.
   Slice filament spools and PCBs, avoid the red-hot nozzles.
   ===================================================================== */
const FS_STATES=['fscount','fsplay','fsover'];
const FS={grav:1500,minSpeed:850,hit:14,max:3,joinUntil:10,cols:['#35e0ff','#ff8a1f','#4dff9a']};
const S={t:0,objs:[],frags:[],pops:[],nextWave:.6,flash:0,shake:0,newBest:false,players:[],blades:[]};
for(let i=0;i<FS.max;i++)for(let k=0;k<2;k++)S.blades.push({pl:i,k,x:0,y:0,px:0,py:0,on:false,pon:false,trail:[],speed:0});
S.blades.push({pl:0,k:2,x:0,y:0,px:0,py:0,on:false,pon:false,trail:[],speed:0});            // mouse
const fsBody=Array.from({length:FS.max},()=>({sx:new OneEuro(1.2,2),sy:new OneEuro(1.2,2),sw:new OneEuro(1.2,2),to:new OneEuro(1.2,2)}));
const fsHandF=Array.from({length:FS.max},()=>[0,1].map(()=>({x:new OneEuro(2.5,15),y:new OneEuro(2.5,15)})));
const fsBest=()=>{try{return JSON.parse(localStorage.getItem('sl_slice_best')||'[]');}catch(e){return[];}};
let fsPoses=1;
window.__fs=S;   // handy for debugging in the console
function fsSetPoses(n){      // track several people only while Filament Slice is open
  if(!landmarker||fsPoses===n)return;fsPoses=n;
  try{const r=landmarker.setOptions({numPoses:n});if(r&&r.catch)r.catch(()=>{});}catch(e){}
}
function resetSlice(){
  Object.assign(S,{t:0,objs:[],frags:[],pops:[],nextWave:.6,flash:0,shake:0,newBest:false});
  S.players=Array.from({length:FS.max},(_,i)=>({i,col:FS.cols[i],score:0,lives:CFG.lives,combo:0,comboT:0,sliced:0,missed:0,
    active:i===0,out:false,lastSx:null,hands:[null,null]}));
  for(const b of S.blades){b.on=b.pon=false;b.trail.length=0;}
}
function startSlice(){resetSlice();fsSetPoses(FS.max);go('fscount');}
const fsActive=()=>S.players.filter(p=>p.active);

function fsWave(){
  const n=1+Math.floor(Math.random()*(1+Math.min(3,S.t/20)))+(fsActive().length>1?1:0);
  const nozP=.1+Math.min(.18,S.t/220);
  for(let i=0;i<n;i++){
    const r=Math.random(),k=r<nozP?'nozzle':(r<.6?'spool':'pcb'),x=rand(300,W-300);
    S.objs.push({k,x,y:H+90,vx:(W/2-x)*rand(.15,.5)+rand(-150,150),vy:-rand(1500,1850),r:k==='pcb'?80:74,rot:rand(0,6),vr:rand(-4,4),hit:false,seen:false});
  }
}
/* find up to 3 people, give each a stable seat (left to right), turn their hands into screen points */
function fsTrack(t){
  const pl=S.players;for(const p of pl)p.hands=[null,null];
  if(!camMode()||!P.all||!P.all.length)return;
  const asp=video.videoWidth/video.videoHeight;
  const info=[];
  for(const lm of P.all){
    const V=i=>lm[i].visibility??1,X=i=>(1-lm[i].x)*asp,Y=i=>lm[i].y;
    if(V(11)<.5||V(12)<.5)continue;
    const sx=(X(11)+X(12))/2,sy=(Y(11)+Y(12))/2,shW=Math.abs(X(11)-X(12));
    const hips=V(23)>.4&&V(24)>.4,torso=hips?Math.max(.05,Math.hypot(sx-(X(23)+X(24))/2,sy-(Y(23)+Y(24))/2)):shW*1.25;
    info.push({lm,V,X,Y,sx,sy,shW,torso});
  }
  info.sort((a,b)=>a.sx-b.sx);
  const used=new Set(),seat=new Map();
  const free=()=>pl.find(p=>!p.active&&!used.has(p.i));
  for(const o of info.slice(0,FS.max)){          // match to the seat whose last position is closest
    let best=null,bd=.5;
    for(const p of pl)if(p.lastSx!==null&&!used.has(p.i)){const d=Math.abs(p.lastSx-o.sx);if(d<bd){bd=d;best=p;}}
    if(!best&&(state==='fscount'||S.t<FS.joinUntil))best=free()||null;
    if(best){used.add(best.i);seat.set(best,o);}
  }
  for(const [p,o] of seat){
    p.active=true;p.lastSx=o.sx;
    const B=fsBody[p.i],sx=B.sx.f(o.sx,t),sy=B.sy.f(o.sy,t),sw=B.sw.f(o.shW,t),to=B.to.f(o.torso,t);
    [[19,15],[20,16]].forEach(([a,b],k)=>{
      const i=o.V(a)>.4?a:(o.V(b)>.4?b:-1);
      if(i<0){fsHandF[p.i][k].x.reset();fsHandF[p.i][k].y.reset();return;}
      const nx=.5+(o.X(i)-sx)/(sw*5.2),ny=.5+(o.Y(i)-sy)/(to*2.8),F2=fsHandF[p.i][k];
      p.hands[k]={x:clamp(F2.x.f(nx,t),-.05,1.05)*W,y:clamp(F2.y.f(ny,t),-.05,1.05)*H};
    });
  }
}
function fsBlades(dt,t){
  fsTrack(t);
  const p0=S.players[0],mouseOn=t-mouse.t<.25&&!p0.hands[0]&&!p0.hands[1];
  if(mouseOn)p0.active=true;
  for(const b of S.blades){
    const pl=S.players[b.pl];let p=null;
    if(!pl.out){if(b.k<2)p=pl.hands[b.k];else if(mouseOn)p={x:mouse.x,y:mouse.y};}
    b.pon=b.on;b.px=b.x;b.py=b.y;
    if(!p){b.on=false;b.trail.length=0;continue;}
    b.on=true;b.x=p.x;b.y=p.y;
    b.speed=b.pon?Math.hypot(b.x-b.px,b.y-b.py)/Math.max(dt,.001):0;
    b.trail.push({x:b.x,y:b.y,a:1});if(b.trail.length>14)b.trail.shift();
  }
  for(const b of S.blades){for(const q of b.trail)q.a-=dt*3.2;while(b.trail.length&&b.trail[0].a<=0)b.trail.shift();}
}
function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;let u=l2?((px-ax)*dx+(py-ay)*dy)/l2:0;u=clamp(u,0,1);
  return Math.hypot(px-(ax+u*dx),py-(ay+u*dy));
}
function fsPop(x,y,s,col,size=44){S.pops.push({x,y,s,col,size,t:0});}
function fsSlice(o,b){
  o.hit=true;
  const pl=S.players[b.pl],ang=Math.atan2(b.y-b.py,b.x-b.px);
  for(const side of[1,-1]){
    const nx=-Math.sin(ang)*side,ny=Math.cos(ang)*side;
    S.frags.push({o,side,ang,x:o.x,y:o.y,vx:o.vx*.6+nx*260,vy:o.vy*.6+ny*260,rot:o.rot,vr:o.vr+side*rand(1,3),life:1.3});
  }
  if(o.k==='nozzle'){
    pl.lives--;pl.combo=0;S.flash=1;S.shake=.4;sfx.hit();fsPop(o.x,o.y,'Ouch! Hot nozzle',C.red,48);
    if(pl.lives<=0){pl.out=true;fsPop(o.x,o.y+60,`Player ${pl.i+1} is out`,pl.col,40);if(fsActive().every(p=>p.out))fsEnd();}
    return;
  }
  pl.combo++;pl.comboT=1.3;pl.sliced++;
  const mult=Math.min(5,1+Math.floor(pl.combo/4)),pts=(o.k==='pcb'?15:10)*mult;
  pl.score+=pts;fsPop(o.x,o.y-30,'+'+pts+(mult>1?'  x'+mult:''),o.k==='pcb'?C.green:C.orange);
  beep(620+Math.min(pl.combo,12)*60,.09,'sawtooth',.05,500);
}
function fsEnd(){
  const top=Math.max(...fsActive().map(p=>p.score));
  const a=fsBest();S.newBest=!a.length||top>a[0];a.push(top);a.sort((x,y)=>y-x);
  try{localStorage.setItem('sl_slice_best',JSON.stringify(a.slice(0,5)));}catch(e){}
  sfx.over();go('fsover');
}
function updateSlice(dt,t){
  if(state==='fscount'){
    const n=Math.floor(stateT);if(n!==cdLast&&n<=3){cdLast=n;if(n<3)sfx.tick();else sfx.go();}
    fsBlades(dt,t);
    if(stateT>3.7){state='fsplay';stateT=0;}
    return;
  }
  if(state!=='fsplay'){fsBlades(dt,t);return;}
  S.t+=dt;S.flash=Math.max(0,S.flash-dt*2.5);S.shake=Math.max(0,S.shake-dt);
  for(const p of S.players){p.comboT-=dt;if(p.comboT<=0&&p.combo)p.combo=0;}
  fsBlades(dt,t);
  S.nextWave-=dt;
  if(S.nextWave<=0){fsWave();S.nextWave=rand(.9,1.6)*Math.max(.55,1-S.t/150)/(fsActive().length>1?1.3:1);}
  for(const o of S.objs){
    o.vy+=FS.grav*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.rot+=o.vr*dt;
    if(o.y<H)o.seen=true;
    if(!o.hit)for(const b of S.blades){
      if(!b.on||!b.pon||b.speed<FS.minSpeed)continue;
      if(segDist(o.x,o.y,b.px,b.py,b.x,b.y)<=o.r+FS.hit){fsSlice(o,b);break;}
    }
    if(state!=='fsplay')return;
  }
  for(const o of S.objs)if(!o.hit&&o.seen&&o.vy>0&&o.y>H+110){o.hit=true;if(o.k!=='nozzle'){for(const p of fsActive())p.combo=0;}}
  S.objs=S.objs.filter(o=>!o.hit&&o.y<H+200);
  for(const f of S.frags){f.vy+=FS.grav*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt;f.life-=dt;}
  S.frags=S.frags.filter(f=>f.life>0&&f.y<H+250);
  for(const p of S.pops)p.t+=dt;S.pops=S.pops.filter(p=>p.t<1.1);
  if(S.t>=CFG.roundSeconds&&state==='fsplay')fsEnd();
}

    ctx.strokeStyle='#4dff9a';ctx.lineWidth=3;ctx.stroke();
    ctx.strokeStyle='#8be8b0';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-w*.4,h*.3);ctx.lineTo(-w*.1,h*.3);ctx.lineTo(w*.05,h*.1);ctx.moveTo(w*.4,-h*.3);ctx.lineTo(w*.15,-h*.3);ctx.stroke();
    ctx.fillStyle='#10131c';ctx.fillRect(-w*.18,-h*.2,w*.36,h*.36);

    ctx.fillStyle='#b85a1a';ctx.beginPath();ctx.moveTo(-r*.42,r*.55);ctx.lineTo(r*.42,r*.55);ctx.lineTo(r*.1,r*1.05);ctx.lineTo(-r*.1,r*1.05);ctx.closePath();ctx.fill();
    ctx.fillStyle=pulse>.5?'#ff4d5e':'#ff8a1f';ctx.beginPath();ctx.arc(0,r*1.05,r*.12,0,7);ctx.fill();
    ctx.fillStyle='#ff4d5e';ctx.font=`700 ${r*.8}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',0,-r*.15);ctx.textBaseline='alphabetic';
  }
}

    if(p.out)txt('OUT',x+18,y+78,24,C.red,'left',700);
    else for(let i=0;i<CFG.lives;i++){const cx=x+18+i*34,on=i<p.lives;
      rr(cx,y+52,28,18,5);ctx.fillStyle=on?'rgba(77,255,154,.9)':'rgba(255,255,255,.12)';ctx.fill();}
    if(p.combo>=3&&!p.out)txt(`Combo ${p.combo}`,x+18+CFG.lives*34+10,y+68,22,C.yellow,'left',700);
    x+=w+gap;
  }
}
function drawSlice(t){
  ctx.save();
  if(S.shake>0)ctx.translate(rand(-1,1)*S.shake*30,rand(-1,1)*S.shake*30);
  bgSpace(t);
  ctx.strokeStyle='rgba(255,138,31,.07)';ctx.lineWidth=2;ctx.strokeRect(160,120,W-320,H-200);
  for(const o of S.objs){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);fsArt(o.k,o.r,t);ctx.restore();}
  for(const f of S.frags){
    ctx.save();ctx.globalAlpha=clamp(f.life*1.5,0,1);ctx.translate(f.x,f.y);ctx.rotate(f.ang);
    ctx.beginPath();ctx.rect(-300,f.side>0?0:-300,600,300);ctx.clip();
    ctx.rotate(f.rot-f.ang);fsArt(f.o.k,f.o.r,t);ctx.restore();
  }
  for(const b of S.blades){
    const col=S.players[b.pl].col;
    if(b.trail.length>1){
      ctx.lineCap='round';
      for(let i=1;i<b.trail.length;i++){
        const a=b.trail[i-1],c=b.trail[i];
        ctx.strokeStyle=col;ctx.globalAlpha=clamp(c.a,0,1)*.9;ctx.lineWidth=4+14*clamp(c.a,0,1);
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(c.x,c.y);ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
    if(b.on){ctx.save();ctx.shadowColor=col;ctx.shadowBlur=24;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,12,0,7);ctx.fill();ctx.restore();}
  }
  for(const p of S.pops){
    ctx.globalAlpha=clamp(1.4-p.t*1.2,0,1);txt(p.s,p.x,p.y-p.t*70,p.size,p.col,'center',700);
  }
  ctx.globalAlpha=1;ctx.restore();
  if(S.flash>0){ctx.fillStyle=`rgba(255,77,94,${S.flash*.35})`;ctx.fillRect(0,0,W,H);}
  brand(50,84,52);
  const left=Math.max(0,CFG.roundSeconds-S.t),bw=700;
  rr(CX-bw/2,38,bw,22,11);ctx.fillStyle='rgba(255,255,255,.12)';ctx.fill();
  rr(CX-bw/2,38,Math.max(8,bw*left/CFG.roundSeconds),22,11);ctx.fillStyle=left<10?C.red:C.cyan;ctx.fill();
  txt(Math.ceil(left)+' s',CX,96,34,C.text,'center',700);
  fsPanels();
  drawCam(40,H-190,260,146,false);
}
function fsDraw(t){
  if(state==='fsover'){
    drawSlice(t);
    ctx.fillStyle='rgba(3,8,18,.84)';ctx.fillRect(0,0,W,H);
    const act=fsActive().slice().sort((a,b)=>b.score-a.score);
    if(act.length>1){
      const tie=act[0].score===act[1].score;
      txt(tie?'It\'s a tie!':`Player ${act[0].i+1} wins!`,CX,200,92,tie?C.yellow:act[0].col,'center',700);
      act.forEach((p,i)=>{
        const y=270+i*110,x=CX-420;
        rr(x,y,840,92,18);ctx.fillStyle='rgba(15,35,66,.9)';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=p.col;ctx.stroke();
        txt(`${i+1}.`,x+30,y+62,44,i===0?C.yellow:C.text,'left',700);
        txt(`Player ${p.i+1}`,x+110,y+60,38,p.col,'left',700);
        txt(`${p.sliced} sliced`,x+520,y+58,26,C.dim,'right',500);
        txt(String(p.score),x+810,y+64,54,C.text,'right',700);
      });
    }else{
      const p=act[0];
      txt(p.out?'Nozzle burn!':'Print complete',CX,220,92,p.out?C.orange:C.green,'center',700);
      txt('Score',CX,320,32,C.dim,'center',500);txt(String(p.score),CX,420,130,C.text,'center',700);
      if(S.newBest)txt('New best!',CX,480,40,C.yellow,'center',700);
      else txt(`${p.sliced} parts sliced`,CX,480,32,C.yellow,'center',600);
      const b=fsBest();txt('Top scores',CX,560,28,C.dim,'center',500);
      b.slice(0,5).forEach((s,i)=>txt(`${i+1}.  ${s}`,CX,602+i*38,30,s===p.score&&i===b.indexOf(p.score)?C.yellow:C.text,'center',600));
    }
    rcBtn('fs:again','Play again',CX-440,840,400,130,true,true,true);
    rcBtn('menu','Back to menu',CX+40,840,400,130,true,false);
    drawCam(40,H-250,350,197);
    return;
  }
  drawSlice(t);
  if(state==='fscount'){
    const n=3-Math.floor(stateT);
    ctx.fillStyle='rgba(3,8,18,.5)';ctx.fillRect(0,0,W,H);
    txt(n>0?String(n):'Go!',CX,560,260,n>0?C.text:C.green,'center',700);
    txt('Swipe your hands through spools and circuit boards',CX,700,40,C.text,'center',600);
    txt('Avoid the red-hot nozzles!',CX,752,36,C.red,'center',700);
    const k=fsActive().length;
    txt(k>1?`${k} players spotted. Everyone scores on their own.`:'Up to 3 players: stand side by side in front of the camera.',CX,806,28,C.cyan,'center',600);
    if(!camMode())txt('Mouse mode: move the mouse quickly across the parts',CX,856,28,C.dim,'center',500);
  }else if(camMode()&&!(P.all&&P.all.length)&&t-mouse.t>1)txt('Step back into the camera view',CX,H-150,32,C.orange,'center',600);
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
function update(dt,t){
  stateT+=dt;lock=Math.max(0,lock-dt);
  if(state!=='menu'&&state!=='fsplay'&&tracked(t)&&P.bothUp){exitHold+=dt;if(exitHold>1.5){exitHold=0;go('menu');}}
  else exitHold=Math.max(0,exitHold-dt*2);
  updateUI(dt,t);
  if(state==='calib')updateCalib(dt,t);
  else if(state==='countdown'){
    const n=Math.floor(stateT);if(n!==cdLast&&n<=3){cdLast=n;if(n<3)sfx.tick();else sfx.go();}
    if(stateT>3.7){state='play';stateT=0;}
  }
  else if(state==='play')updateRun(dt,t);
  if(RC_STATES.includes(state))rcUpdate(dt,t);
  else if(FS_STATES.includes(state))updateSlice(dt,t);
  else if(NET.peer)netTick(dt);
}
function draw(t){
  buttons=[];
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
  if(state==='menu')drawMenu(t);
  else if(state==='calib')drawCalib(t);
  else if(state==='countdown'||state==='play'){
    drawScene(t);
    if(state==='countdown'){
      const n=3-Math.floor(stateT);
      ctx.fillStyle='rgba(3,8,18,.45)';ctx.fillRect(0,0,W,H);
      txt(n>0?String(n):'Go!',CX,560,260,n>0?C.text:C.green,'center',700);
    }
    if(state==='countdown'||(state==='play'&&R.t<7))controlsHint();
    if(state==='play'&&camMode()&&!tracked(t)){
      ctx.fillStyle='rgba(3,8,18,.7)';ctx.fillRect(0,0,W,H);
      txt('Player lost',CX,500,90,C.orange,'center',700);
      txt('Step back into the camera view to continue',CX,570,36,C.text,'center',500);
    }
  }
  else if(state==='over')drawOver(t);
  else if(RC_STATES.includes(state))rcDraw(t);
  else if(FS_STATES.includes(state))fsDraw(t);
  drawExitBtn();
  drawCursor();
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  detect(now);update(dt,now/1000);draw(now/1000);
  requestAnimationFrame(frame);
}

/* =====================================================================
   INPUT: mouse + keyboard fallback, and boot
   ===================================================================== */
function toLogical(e){
  const r=cv.getBoundingClientRect(),s=Math.min(r.width/W,r.height/H);
  return{x:(e.clientX-r.left-(r.width-W*s)/2)/s,y:(e.clientY-r.top-(r.height-H*s)/2)/s};
}
cv.addEventListener('mousemove',e=>{const p=toLogical(e);mouse.x=p.x;mouse.y=p.y;mouse.t=performance.now()/1000;});
cv.addEventListener('click',e=>{
  const p=toLogical(e);mouse.x=p.x;mouse.y=p.y;mouse.t=performance.now()/1000;
  if(lock>0)return;
  for(const b of buttons)if(b.on&&inRect({on:true,...p},b.x,b.y,b.w,b.h)){press(b.id);break;}
});
addEventListener('keydown',e=>{
  if(e.key==='Escape'||e.key==='m'){if(state!=='menu')go('menu');return;}
  if(state==='play'){
    if(e.key==='ArrowLeft')R.lane=Math.max(-1,R.lane-1);
    else if(e.key==='ArrowRight')R.lane=Math.min(1,R.lane+1);
    else if(e.key==='ArrowUp'||e.key===' '){jump();e.preventDefault();}
    else if(e.key==='ArrowDown')kb.down=true;
  }else if((e.key==='Enter'||e.key===' ')&&(state==='menu'))press('game:runner');
  else if(e.key==='Enter'&&state==='over')press('again');
});
addEventListener('keyup',e=>{if(e.key==='ArrowDown')kb.down=false;});

async function goFull(){
  try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen({navigationUI:'hide'});}catch(e){}
}
addEventListener('keydown',e=>{      // F toggles full screen
  if(e.key==='f'||e.key==='F'){
    if(document.fullscreenElement)document.exitFullscreen();else goFull();
  }
});
let installEv=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e;document.getElementById('installBtn').style.display='';});
document.getElementById('installBtn').addEventListener('click',async()=>{
  if(!installEv)return;installEv.prompt();await installEv.userChoice;installEv=null;document.getElementById('installBtn').style.display='none';
});
document.getElementById('startBtn').addEventListener('click',async()=>{
  document.getElementById('start').style.display='none';
  try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  goFull();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  requestAnimationFrame(frame);
  await initCam();
  if(camOK)await initModel();
});
</script>
